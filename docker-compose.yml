services:
  # ============================================================================
  # Database Service (PostgreSQL 17, pgEdge image with pgAudit and pgBackRest)
  # Security: isolated on internal network, read-only root, dropped capabilities,
  # secrets-backed password, mutual TLS certificates, explicit resource limits.
  # ============================================================================
  db:
    image: ghcr.io/pgedge/pgedge-postgres:17-spock5-standard@sha256:6d2fb528a11a059d07247e38b38e601a3795d1ab2bfd78ad945f9e77227c0a15
    container_name: kura-db
    restart: unless-stopped
    read_only: true
    # Writable in-memory RAM partitions: temp files, PostgreSQL Unix sockets
    # (used by the health check and pgBackRest), and pgBackRest log files.
    tmpfs:
      - /tmp:size=128M,mode=1777
      - /var/run/postgresql:size=16M,mode=1777
      - /var/log/pgbackrest:size=64M,mode=1777
    volumes:
      # pgEdge layout: the cluster lives in /var/lib/pgsql/17/data (the image
      # pre-creates this path with the correct postgres ownership).
      - postgres_data:/var/lib/pgsql/17/data
      # pgBackRest WAL archive and backup repository storage.
      - postgres_backups:/var/lib/pgbackrest
      # Mutual TLS: PostgreSQL's own certificate and key, plus the CA certificate
      # used to check client certificates. Only these three files are mounted, so
      # this container never sees another service's key or the CA private key.
      - ./certs/internal/ca.crt:/var/lib/postgresql/certs/ca.crt:ro
      - ./certs/internal/db.crt:/var/lib/postgresql/certs/db.crt:ro
      - ./certs/internal/db.key:/var/lib/postgresql/certs/db.key:ro
      # Runs once on first start: creates the least-privilege roles and grants.
      - ./docker/postgres/init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
      # pgBackRest configuration (points at the pgEdge data path).
      - ./docker/postgres/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      # Backup and restore operators available inside the container.
      - ./docker/postgres/backup.sh:/usr/local/bin/backup.sh:ro
      - ./docker/postgres/restore.sh:/usr/local/bin/restore.sh:ro
      # Custom PostgreSQL server configuration (SSL/mTLS, WAL archiving, pgAudit).
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker/postgres/pgaudit.conf:/etc/postgresql/pgaudit.conf:ro
      # Client authentication rules (certificate + password policies).
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      - backend
    secrets:
      - db_password
      - backup_encryption_key
    environment:
      # Standard official-style entrypoint variables supported by the pgEdge image.
      POSTGRES_DB: kura
      POSTGRES_USER: kura-admin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      # UTF-8 database with page checksums (the image defaults to a C locale).
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --data-checksums
      PGDATA: /var/lib/pgsql/17/data
    # Point the server at the mounted configuration and authentication files,
    # overriding the default copies generated inside the data directory.
    command:
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    # Drop all Linux capabilities and only retain minimal permissions required
    # for the entrypoint to set data folder ownership and drop to user postgres
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    # Resource limits to prevent denial-of-service / resource starvation
    mem_limit: 1536m
    cpus: 1.5
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kura-admin -d kura"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ============================================================================
  # Application Service (Django WSGI running on Gunicorn)
  # Security: non-root user (kura, UID 10001), read-only root filesystem,
  # zero capabilities (cap_drop ALL), memory/CPU limits, Docker secrets.
  # ============================================================================
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: kura-web:latest
    container_name: kura-web
    restart: unless-stopped
    read_only: true
    # Writable in-memory RAM partitions for Python temporary files and runtime sockets
    tmpfs:
      - /tmp:size=256M,mode=1777
      - /run:size=16M,mode=1777
      # Writable state for Gunicorn's control server on a read-only filesystem
      - /app/.gunicorn:size=16M,mode=1777
    volumes:
      - static_data:/app/staticfiles
      # Only Django's own certificate and key, plus the CA certificate.
      - ./certs/internal/ca.crt:/certs/internal/ca.crt:ro
      - ./certs/internal/web.crt:/certs/internal/web.crt:ro
      - ./certs/internal/web.key:/certs/internal/web.key:ro
    # app: only the WAF can reach Django, so the WAF cannot be bypassed.
    # backend: so Django can reach PostgreSQL and Vault.
    # clamav: internal network shared only with ClamAV (INSTREAM is plain TCP; CFG-06).
    # mail: so Django can hand email to the Postfix relay (nothing else is there).
    # breach_check: so Django can reach the breach-check proxy (nothing else is there).
    # Not on frontend (Nginx/cloudflared) or observability.
    networks:
      - app
      - backend
      - clamav
      - mail
      - breach_check
    # No db_password here: that is the kura-admin (superuser) password. Django
    # logs in as kura_app with its certificate, so it never needs it. If Django
    # were ever broken into, the attacker must not find the superuser password.
    # Migrations use the separate "migrate" service below instead.
    secrets:
      - django_secret_key
      # Django's AppRole login for Vault (written by docker/vault/init-vault.sh).
      - vault_role_id
      - vault_secret_id
    environment:
      DEBUG: "False"
      DATABASE_NAME: kura
      # Django logs in as temporary users from Vault (15 minutes each, members
      # of the least-privilege role kura_app), not a fixed account. See
      # kura/vault_postgres/base.py. Migrations use the "migrate" service.
      VAULT_DATABASE_CREDENTIALS: "True"
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      # KURA_PUBLIC_HOSTNAME is the Cloudflare Tunnel hostname, set in .env
      # on the server (e.g. KURA_PUBLIC_HOSTNAME=kura.yourdomain.com).
      ALLOWED_HOSTS: "localhost,127.0.0.1,web,${KURA_PUBLIC_HOSTNAME:-kura.example.com}"
      CLAMAV_HOST: "clamav"
      CLAMAV_PORT: "3310"
      CLAMAV_REQUIRED: "True"
      # HTTPS: Django checks Vault's certificate against our internal CA.
      VAULT_URL: "https://vault:8200"
      VAULT_CA_CERT: "/certs/internal/ca.crt"
      VAULT_ENABLED: "True"
      MTLS_ENABLED: "True"
      # Trust the WAF's X-Real-IP header for the visitor's IP. Safe only because
      # MTLS_ENABLED makes Gunicorn require a client certificate, and Django is
      # only reachable from the WAF (app network). See config/settings.py.
      TRUST_PROXY_IP_HEADER: "True"
      # Email: Django hands mail to the Postfix relay with STARTTLS. Python's
      # default TLS checks use SSL_CERT_FILE, so the relay's certificate is
      # checked against Kura's internal CA (and nothing else is trusted).
      EMAIL_HOST: "relay"
      EMAIL_PORT: "25"
      EMAIL_USE_TLS: "True"
      SSL_CERT_FILE: "/certs/internal/ca.crt"
      DEFAULT_FROM_EMAIL: "Kura <noreply@kura.edu>"
      # Breached-password check: through the breach-check proxy, checking
      # HaveIBeenPwned's certificate against the public CAs (SSL_CERT_FILE above
      # trusts only Kura's internal CA). See config/settings.py.
      BREACH_CHECK_PROXY_URL: "http://breach-proxy:8888"
      BREACH_CHECK_CA_FILE: "/etc/ssl/certs/ca-certificates.crt"
      # Links in emails always point here (never at the Host header a visitor sent).
      SITE_URL: "https://${KURA_PUBLIC_HOSTNAME:-kura.example.com}"
      DB_SSL_MODE: "verify-full"
      DB_SSL_ROOTCERT: "/certs/internal/ca.crt"
      DB_SSL_CERT: "/certs/internal/web.crt"
      DB_SSL_KEY: "/certs/internal/web.key"
    # Unprivileged user requires no kernel capabilities
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Resource limits
    mem_limit: 2048m
    cpus: 2.0
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    # Django needs the database and Vault (for its database login).
    depends_on:
      db:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os, ssl, urllib.request; mtls = os.environ.get('MTLS_ENABLED', 'False').lower() in ('true', '1'); ctx = ssl.create_default_context(ssl.Purpose.SERVER_AUTH, cafile='/certs/internal/ca.crt') if mtls else None; ctx.load_cert_chain('/certs/internal/web.crt', '/certs/internal/web.key') if mtls else None; ctx.check_hostname = False if mtls else None; urllib.request.urlopen('https://127.0.0.1:8443/login/' if mtls else 'http://127.0.0.1:8000/login/', context=ctx)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================================================
  # Database Migrations (one-off job, never left running)
  # Runs "manage.py migrate" as kura-admin, the database owner, because creating
  # and changing tables needs more rights than kura_app has. It is the only Kura
  # container given the kura-admin password, and it exits when it is done.
  # The "tools" profile stops "docker compose up" from starting it. Run it with:
  #   docker compose run --rm migrate
  # ============================================================================
  migrate:
    image: kura-web:latest
    profiles: ["tools"]
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
    command: ["python", "manage.py", "migrate", "--noinput"]
    volumes:
      # Only the CA certificate, to check it is really talking to our database.
      - ./certs/internal/ca.crt:/certs/internal/ca.crt:ro
    # backend only: it needs the database and nothing else.
    networks:
      - backend
    secrets:
      - db_password
      - django_secret_key
    environment:
      DEBUG: "False"
      DATABASE_NAME: kura
      DATABASE_USER: kura-admin
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      # Migrations never encrypt anything, so this job does not talk to Vault.
      VAULT_ENABLED: "False"
      # Password login (pg_hba.conf "scram-sha-256") inside TLS, and the
      # database's certificate must be signed by our CA and named "db".
      DB_SSL_MODE: "verify-full"
      DB_SSL_ROOTCERT: "/certs/internal/ca.crt"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy

  # ============================================================================
  # Self-hosted NetBird VPN server (admin access only), v0.82.0.
  #   netbird-proxy     nginx, TLS on 443 for https://netbird.kura.lan (Vault cert)
  #   netbird-server    management + signal + relay + STUN + login (embedded IdP)
  #   netbird-dashboard the admin web interface
  # Admins install the NetBird app; nothing here is exposed through Cloudflare.
  # Set up once with docker/netbird/server/setup-netbird.sh (admin, MFA, groups,
  # policy, setup keys). See docker/netbird/README.md.
  # NETBIRD_BIND_ADDRESS: 127.0.0.1 (default, this computer only) or 0.0.0.0 on
  # the VM so admins on the LAN can reach it.
  # ============================================================================
  netbird-proxy:
    image: nginx:1.31.8-alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
    container_name: kura-netbird-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32M,mode=1777
      - /var/run:size=8M,mode=1777
      - /tmp:size=16M,mode=1777
    ports:
      - "${NETBIRD_BIND_ADDRESS:-127.0.0.1}:443:443"
    volumes:
      - ./docker/netbird/server/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Only its own certificate and key (from Vault's CA).
      - ./certs/internal/netbird.crt:/etc/nginx/certs/netbird.crt:ro
      - ./certs/internal/netbird.key:/etc/nginx/certs/netbird.key:ro
    networks:
      netbird:
        # Fixed: netbird-server trusts forwarded client addresses only from here.
        ipv4_address: 172.28.40.10
        # Lets containers on this network (and test clients) reach it by name.
        aliases: [netbird.kura.lan]
    # nginx's master starts as root to bind 443 and read its key, then workers drop privileges.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    depends_on:
      - netbird-server
      - netbird-dashboard
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate --spider https://127.0.0.1:443/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  netbird-server:
    image: netbirdio/netbird-server:0.82.0@sha256:7b5b53b2dc8bc25639f791cf72d47cf86911894ff3f8a97cb79bab9be958109c
    container_name: kura-netbird-server
    restart: unless-stopped
    read_only: true
    # Config (with its secret keys) comes from secrets/netbird_config.yaml.
    command: ["--config", "/run/secrets/netbird_config"]
    environment:
      # Only true while docker/netbird/server/setup-netbird.sh runs: lets the
      # one-time /api/setup call also create an access token for scripting.
      NB_SETUP_PAT_ENABLED: "${NETBIRD_SETUP_PAT_ENABLED:-false}"
    volumes:
      # NetBird's database (peers, users, policies; sensitive fields encrypted).
      - netbird_server_data:/var/lib/netbird
      # Scratch space on disk (not memory): the one-time GeoLite location
      # database download unpacks several hundred MB of CSV files here.
      - netbird_server_tmp:/tmp
    secrets:
      - netbird_config
    ports:
      # STUN: lets admin devices discover their public address for direct
      # (peer-to-peer) connections. Without it, traffic falls back to the relay.
      - "${NETBIRD_BIND_ADDRESS:-127.0.0.1}:3478:3478/udp"
    networks:
      - netbird
    # Runs as root inside the image, but with every Linux capability removed.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # 512 MB: importing the location database on first start needs the room.
    mem_limit: 512m
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  netbird-dashboard:
    image: netbirdio/dashboard:v2.96.0-rootless@sha256:0f0097965c36bd4702eae6cdb007d6398ea7783f3d395942c909c7fb55a827d4
    container_name: kura-netbird-dashboard
    restart: unless-stopped
    environment:
      # Where the dashboard (running in the admin's browser) finds the server.
      NETBIRD_MGMT_API_ENDPOINT: "https://netbird.kura.lan"
      NETBIRD_MGMT_GRPC_API_ENDPOINT: "https://netbird.kura.lan"
      # Login through NetBird's embedded identity provider.
      AUTH_AUDIENCE: "netbird-dashboard"
      AUTH_CLIENT_ID: "netbird-dashboard"
      AUTH_CLIENT_SECRET: ""
      AUTH_AUTHORITY: "https://netbird.kura.lan/oauth2"
      USE_AUTH0: "false"
      AUTH_SUPPORTED_SCOPES: "openid profile email groups"
      AUTH_REDIRECT_URI: "/nb-auth"
      AUTH_SILENT_REDIRECT_URI: "/nb-silent-auth"
      # TLS is done by netbird-proxy, not by the dashboard's own nginx.
      LETSENCRYPT_DOMAIN: "none"
    networks:
      - netbird
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M

  # ============================================================================
  # Mail Relay (Postfix, built from docker/postfix on a pinned Alpine image)
  # Django -> relay (STARTTLS, Vault certificate) -> mail provider (TLS checked,
  # login from the smtp_relay_credentials secret). Accepts mail only from the
  # private "mail" network and only from noreply@kura.edu. The only Kura
  # container with internet access for email. See docker/postfix/README.md.
  # ============================================================================
  relay:
    build:
      context: ./docker/postfix
    image: kura-relay:latest
    container_name: kura-relay
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16M,mode=1777
      # Postfix's own state; must belong to the "postfix" user (UID 100, GID 101).
      - /var/lib/postfix:size=16M,uid=100,gid=101,mode=0700
      - /run:size=8M
    volumes:
      # The mail queue survives restarts, so no email is lost while the provider is down.
      - relay_queue:/var/spool/postfix
      - ./docker/postfix/main.cf:/etc/postfix/main.cf:ro
      # Only the relay's own certificate and key (from Vault's CA).
      - ./certs/internal/relay.crt:/etc/postfix/tls/relay.crt:ro
      - ./certs/internal/relay.key:/etc/postfix/tls/relay.key:ro
    secrets:
      - smtp_relay_credentials
    # mail: Django reaches the relay here (internal, fixed subnet in main.cf).
    # mail_egress: the relay's only route to the internet (the mail provider).
    networks:
      - mail
      - mail_egress
    # Postfix starts as root to open port 25 and fix its queue folders, then
    # runs its workers as the unprivileged "postfix" user.
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    healthcheck:
      test: ["CMD", "postfix", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # Breach-check proxy (tinyproxy, built from docker/breach-proxy on a pinned
  # Alpine image). Django has no internet route; this is its only way out, and
  # it allows exactly one thing: an HTTPS tunnel to api.pwnedpasswords.com, for
  # the breached-password check. Every other site gets "403 Filtered". TLS runs
  # from Django straight to HaveIBeenPwned, so the proxy sees no data.
  # ============================================================================
  breach-proxy:
    build:
      context: ./docker/breach-proxy
    image: kura-breach-proxy:latest
    container_name: kura-breach-proxy
    restart: unless-stopped
    read_only: true
    # breach_check: Django reaches the proxy here (internal, fixed subnet that
    # tinyproxy.conf's "Allow" line accepts).
    # breach_check_egress: the proxy's only route to the internet.
    networks:
      - breach_check
      - breach_check_egress
    # Runs as the unprivileged "tinyproxy" user on port 8888: no capabilities needed.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 32m
    cpus: 0.1
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 32M
    # Healthy when tinyproxy is listening on its port.
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8888"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # Reverse Proxy Service (Nginx Alpine)
  # Security: TLS 1.3 only, HSTS, rate limits, 25MB body limit, server tokens hidden,
  # read-only root, dropped capabilities, isolated on frontend network.
  # ============================================================================
  nginx:
    image: nginx:1.31.8-alpine@sha256:785835ea65db4bba6f021acc0f3be91b0fef76a53fe41f8588c6698d2aed0606
    container_name: kura-nginx
    restart: unless-stopped
    read_only: true
    # Writable in-memory RAM partitions for cache, process IDs, and temp buffers
    tmpfs:
      - /var/cache/nginx:size=64M,mode=1777
      - /var/run:size=16M,mode=1777
      - /tmp:size=64M,mode=1777
    ports:
      - "127.0.0.1:8080:80"
      - "127.0.0.1:8443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d:/etc/nginx/conf.d:ro
      # Public HTTPS certificate, then Nginx's own internal mTLS files.
      - ./certs/kura.crt:/etc/nginx/certs/kura.crt:ro
      - ./certs/kura.key:/etc/nginx/certs/kura.key:ro
      - ./certs/internal/ca.crt:/etc/nginx/certs/internal/ca.crt:ro
      - ./certs/internal/nginx.crt:/etc/nginx/certs/internal/nginx.crt:ro
      - ./certs/internal/nginx.key:/etc/nginx/certs/internal/nginx.key:ro
      - static_data:/app/staticfiles:ro
    networks:
      frontend:
        # Fixed address: the WAF trusts the X-Real-IP header only from here.
        ipv4_address: 172.28.10.20
    # Drop all kernel capabilities and only retain minimal permissions for binding and worker user switching
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    # Resource limits to prevent DoS
    mem_limit: 512m
    cpus: 1.0
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M
    depends_on:
      - waf
    healthcheck:
      # Probing port 443 exercises the complete chain:
      # TLS termination here, then Nginx -> WAF -> Django, both over mutual TLS.
      test: ["CMD-SHELL", "wget -q --no-check-certificate --spider https://127.0.0.1:443/login/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ============================================================================
  # Web Application Firewall Service (Coraza WAF with OWASP Core Rule Set v4)
  # Request path: Nginx --mTLS--> WAF --mTLS--> Django.
  # Security: blocks at CRS anomaly score 5 (paranoia 1, detection-only at 2),
  # accepts only Nginx's client certificate, read-only root, runs as the
  # image's unprivileged "nginx" user with no capabilities.
  # All configuration is in docker/coraza/ (see the README there).
  # ============================================================================
  waf:
    image: ghcr.io/coreruleset/coraza-crs:nginx@sha256:0089154673011788070e7b7591b62dd8e7a6686d4e6ba75ad92947b97d54799a
    container_name: kura-waf
    restart: unless-stopped
    read_only: true
    # The image's start-up script writes generated config files, which a
    # read-only container cannot do. We mount finished config files instead
    # and start nginx directly.
    entrypoint: ["nginx", "-c", "/etc/coraza/nginx.conf", "-g", "daemon off;"]
    # Writable in-memory folders for nginx temp files and Coraza's work files.
    tmpfs:
      - /tmp:size=128M,mode=1777
      - /var/cache/nginx:size=64M,mode=1777
    volumes:
      - ./docker/coraza/nginx.conf:/etc/coraza/nginx.conf:ro
      - ./docker/coraza/coraza-rules.conf:/etc/coraza/coraza-rules.conf:ro
      - ./docker/coraza/coraza.conf:/etc/coraza/coraza.conf:ro
      - ./docker/coraza/kura-crs-setup.conf:/etc/coraza/kura-crs-setup.conf:ro
      - ./docker/coraza/rules.d:/etc/coraza/rules.d:ro
      # Only the WAF's own certificate and key, plus the CA certificate.
      - ./certs/internal/ca.crt:/certs/internal/ca.crt:ro
      - ./certs/internal/waf.crt:/certs/internal/waf.crt:ro
      - ./certs/internal/waf.key:/certs/internal/waf.key:ro
    # frontend: Nginx connects in. app: the WAF connects on to Django.
    networks:
      - frontend
      - app
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Resource limits to prevent DoS
    mem_limit: 512m
    cpus: 1.0
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M
    depends_on:
      - web
    healthcheck:
      # Loopback-only health endpoint inside the WAF (docker/coraza/nginx.conf).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # Antivirus Scanner Service (official multi-architecture ClamAV image)
  # Security: scans file uploads in memory via INSTREAM protocol on port 3310,
  # isolated on backend network with no public ports exposed, read-only root,
  # persistent volume for signature database, resource limits.
  # ============================================================================
  clamav:
    image: clamav/clamav-debian:1.5.4@sha256:c21aa18cc0a358678255a3dfb343a4555b58f71b97d7b869df8fdf7ea0a5b4b1
    container_name: kura-clamav
    restart: unless-stopped
    read_only: true
    # Start as the scanner user without granting root capabilities.
    user: "1000:1000"
    entrypoint: /init-unprivileged
    # Scanner sockets and logs need writable temporary storage.
    tmpfs:
      - /tmp:size=128M,mode=1777
      - /var/log/clamav:size=16M,uid=1000,gid=1000,mode=0750
    volumes:
      - clamav_db:/var/lib/clamav
      # Kura's scanner settings: reject encrypted files, Office macros and
      # files too large/deep to scan (see docker/clamav/clamd.conf).
      - ./docker/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    # clamav: internal network shared only with web because INSTREAM is plain TCP (CFG-06).
    # clamav_updates: lets freshclam download new virus signatures from the
    # internet (clamav is internal and has no internet route). No other
    # container is on either network, so Nginx, WAF, DB and Vault cannot reach ClamAV.
    networks:
      - clamav
      - clamav_updates
    # Drop all kernel capabilities
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # ClamAV signature database requires around 1-1.5 GB memory
    mem_limit: 1536m
    cpus: 1.0
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
        reservations:
          cpus: "0.2"
          memory: 512M
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  # ============================================================================
  # Intrusion Detection & Prevention Service (CrowdSec IDS/IPS)
  # Security: monitors Nginx access/error logs, detects brute-force attacks
  # and web exploitation, generates dynamic 4-hour bans pushed to nftables.
  # ============================================================================
  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.2@sha256:65b74942f7e7ed5c60fde4ac15fc4ba715904c398c8b16dd451f4907d90347d4
    container_name: kura-crowdsec
    restart: unless-stopped
    ports:
      # Exposes Local API on loopback only for the firewall bouncer
      - "127.0.0.1:8085:8080"
    environment:
      # crowdsecurity/linux adds the base parsers the others depend on.
      COLLECTIONS: "crowdsecurity/linux crowdsecurity/nginx crowdsecurity/http-cve crowdsecurity/base-http-scenarios"
      BOUNCER_KEY_FIREWALL_FILE: /run/secrets/crowdsec_bouncer_key
    volumes:
      - ./docker/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./docker/crowdsec/profiles.yaml:/etc/crowdsec/profiles.yaml:ro
      # Turns on Prometheus metrics on :6060 for Alloy (WP3).
      - ./docker/crowdsec/config.yaml.local:/etc/crowdsec/config.yaml.local:ro
      # Kura's own parsers, whitelist and scenarios (docker/crowdsec/README.md).
      - ./docker/crowdsec/parsers/kura-django-logfmt.yaml:/etc/crowdsec/parsers/s01-parse/kura-django-logfmt.yaml:ro
      - ./docker/crowdsec/parsers/kura-coraza-audit.yaml:/etc/crowdsec/parsers/s01-parse/kura-coraza-audit.yaml:ro
      - ./docker/crowdsec/parsers/kura-whitelist.yaml:/etc/crowdsec/parsers/s02-enrich/kura-whitelist.yaml:ro
      - ./docker/crowdsec/scenarios/login-bruteforce.yaml:/etc/crowdsec/scenarios/kura-login-bruteforce.yaml:ro
      - ./docker/crowdsec/scenarios/mfa-bruteforce.yaml:/etc/crowdsec/scenarios/kura-mfa-bruteforce.yaml:ro
      - ./docker/crowdsec/scenarios/idor-probing.yaml:/etc/crowdsec/scenarios/kura-idor-probing.yaml:ro
      - ./docker/crowdsec/scenarios/waf-repeat-offender.yaml:/etc/crowdsec/scenarios/kura-waf-repeat-offender.yaml:ro
      - ./docker/crowdsec/scenarios/reset-abuse.yaml:/etc/crowdsec/scenarios/kura-reset-abuse.yaml:ro
      - crowdsec_data:/var/lib/crowdsec/data
      - crowdsec_config:/etc/crowdsec
    secrets:
      - crowdsec_bouncer_key
    # No "frontend": CrowdSec reads every log through the Docker API proxy and
    # needs no access to nginx, cloudflared or the WAF over the network.
    networks:
      - observability
      # Gives CrowdSec read-only access to container logs through the proxy.
      - docker_api
    # Hardened like the other services. CrowdSec writes only to its two volumes
    # (/etc/crowdsec, /var/lib/crowdsec/data) and /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Resource limits to prevent DoS
    mem_limit: 512m
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    depends_on:
      - nginx
    healthcheck:
      # Check that CrowdSec can authenticate to its own Local API.
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # NOTE: the CrowdSec nftables firewall bouncer is NOT a container.
  # CrowdSec publishes it as a Linux host package (crowdsec-firewall-bouncer-nftables),
  # not as a Docker image, so it is installed on the host in the host-layer step.
  # It reads bans from the CrowdSec Local API on 127.0.0.1:8085 (published above).

  # ============================================================================
  # Cloudflare Tunnel Service (cloudflared)
  # Security: outbound-only encrypted tunnel to Cloudflare Edge.
  # Requires zero public inbound ports open on host firewall (ports 80/443 closed).
  # Read-only root filesystem, dropped capabilities, token injected via secret.
  # ============================================================================
  cloudflared:
    # Only started with "docker compose --profile remote-access up -d", once a
    # real tunnel token is in secrets/cloudflare_tunnel_token.txt (otherwise it
    # restarts in a loop). See docker/cloudflare/README.md.
    profiles: ["remote-access"]
    image: cloudflare/cloudflared:2026.10.7@sha256:4955524aeaa379e154023d5a027c250f7b35041a2e7e950cf13f144bc9b9c5ba
    container_name: kura-cloudflared
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32M,mode=1777
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_tunnel_token
    volumes:
      - ./docker/cloudflare/config.yml:/etc/cloudflared/config.yml:ro
      # Nginx's public certificate, so cloudflared can VERIFY it is talking to
      # our Nginx (instead of "No TLS Verify"). See docker/cloudflare/README.md.
      - ./certs/kura.crt:/etc/cloudflared/origin-ca.crt:ro
    secrets:
      - cloudflare_tunnel_token
    networks:
      frontend:
        # Fixed address: Nginx trusts CF-Connecting-IP only from here.
        ipv4_address: 172.28.10.10
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    depends_on:
      - nginx

  # ============================================================================
  # Log Aggregation Service (Grafana Loki)
  # Security: tamper-resistant log store, enforces mandatory 180-day retention
  # (4320h) per Egyptian Law No. 175 and LMS specification, internal network only.
  # ============================================================================
  loki:
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    container_name: kura-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./docker/loki/loki.yml:/etc/loki/loki.yml:ro
      - ./docker/loki/rules:/etc/loki/rules:ro
      - loki_data:/var/loki
    networks:
      - observability
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    # No Docker health check: the Loki image has no shell, wget or curl, so a
    # check inside the container can never run (it only ever reported
    # "unhealthy"). Instead Alloy probes http://loki:3100/ready from outside
    # (prometheus.exporter.blackbox in docker/alloy/config.alloy), and the
    # ServiceDown / LokiNotReady alerts fire if it stops answering.

  # ============================================================================
  # Time-Series Monitoring Service (Prometheus)
  # Security: collects internal metrics, evaluates security alerting rules,
  # isolated on internal observability network with no public ports.
  # ============================================================================
  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    container_name: kura-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=180d
      - --web.enable-lifecycle
      # Alloy forwards scraped samples to this Prometheus remote-write endpoint.
      - --web.enable-remote-write-receiver
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - observability
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================================================
  # Alert Dispatcher Service (Prometheus Alertmanager)
  # Security: groups and routes critical alerts to Telegram, uses Docker secrets
  # for bot credentials, isolated on internal observability network.
  # ============================================================================
  alertmanager:
    image: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    container_name: kura-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # Only the CA certificate, to check the mail relay's certificate.
      - ./certs/internal/ca.crt:/certs/ca.crt:ro
    secrets:
      - telegram_bot_token
      - telegram_chat_id
    networks:
      - observability
      # Alert emails go to the Postfix relay here (it accepts 172.28.30.0/24).
      - mail
    read_only: true
    tmpfs:
      - /alertmanager:size=32M,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.2
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # Unified Telemetry Collector (Grafana Alloy)
  # Security: scrapes Nginx logs and telemetry, streams to Loki and Prometheus.
  # Read-only log access, isolated on observability network.
  # ============================================================================
  alloy:
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    container_name: kura-alloy
    # Match the image's data-directory owner when capabilities are dropped.
    user: "473:473"
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      # The public site address that the "site" probe checks end to end.
      KURA_PUBLIC_HOSTNAME: "${KURA_PUBLIC_HOSTNAME:-kura.example.com}"
    read_only: true
    tmpfs:
      # Alloy's temporary files stay in memory on its read-only filesystem.
      - /tmp:size=32M,mode=1777
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Alloy trusts Vault's HTTPS server certificate using only the public CA.
      - ./certs/internal/ca.crt:/etc/alloy/certs/ca.crt:ro
      # Alloy's own client certificate and key, for its PostgreSQL monitoring login.
      - ./certs/internal/alloy.crt:/etc/alloy/certs/alloy.crt:ro
      - ./certs/internal/alloy.key:/etc/alloy/certs/alloy.key:ro
      # Keep log offsets across restarts so old logs are not replayed.
      - alloy_data:/var/lib/alloy/data
      # Script-health and app-metric files written by the cron jobs (WP11).
      # Set KURA_METRICS_DIR=/var/lib/kura-metrics in .env on the VM.
      - ${KURA_METRICS_DIR:-./var/metrics}:/var/lib/kura-metrics:ro
      # Host cron job logs (/var/log/kura/*.log), mounted read-only into Alloy.
      - ${KURA_LOG_DIR:-./var/log/kura}:/var/log/kura:ro
      # Host CPU, memory, disk and network figures, read-only (WP3).
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    networks:
      - observability
      # Docker log access is limited by the internal socket-proxy network.
      - docker_api
      # WP3 metrics are scraped from Vault and other internal services here.
      - backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    depends_on:
      - loki
      - prometheus

  # ============================================================================
  # Read-only Docker API proxy for Alloy and CrowdSec.
  # LinuxServer's maintained compatible image is used instead of Tecnativa's
  # because Tecnativa versions through 0.5.0 have CVE-2026-78122; the reported
  # fix was still an open upstream pull request on 2026-11-06. LinuxServer's
  # separate ALLOW_LOGS control lets Alloy read logs while keeping other
  # container filesystem endpoints disabled.
  # Image version 3.4.7, released 2026-10-27; checked 2026-11-06.
  # ============================================================================
  docker-api-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.7@sha256:4e5e59efd3338205561c54262581992036e5a36ccca97d487b1d4ec41f9adc58
    container_name: kura-docker-api-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      # The proxy writes its generated HAProxy configuration under /run.
      - /run:size=16M,mode=1777
    volumes:
      # The socket is the proxy's only route to Docker; ACLs below limit requests.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # The upstream image needs root inside the container to read the Docker socket.
    environment:
      # Alloy needs only container and network listing, log reads, and Docker event updates.
      CONTAINERS: "1"
      EVENTS: "1"
      ALLOW_LOGS: "1"
      POST: "0"
      # Explicitly deny archive, export, and filesystem-change inspection.
      ALLOW_ARCHIVE: "0"
      ALLOW_CHANGES: "0"
      ALLOW_EXPORT: "0"
      ALLOW_PAUSE: "0"
      ALLOW_RESTARTS: "0"
      ALLOW_START: "0"
      ALLOW_STOP: "0"
      ALLOW_TOP: "0"
      ALLOW_UNPAUSE: "0"
      # Disable Docker API sections that are not needed for log collection.
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      EXEC: "0"
      IMAGES: "0"
      # CrowdSec's Docker log source calls GET /info when it starts and exits
      # if refused (it crashed in a loop with INFO=0). Read-only system facts.
      INFO: "1"
      # Alloy's Docker discovery also lists networks (to label containers by
      # network); without this every discovery refresh failed with 403 and no
      # container logs reached Loki. Read-only: POST=0 still blocks any change.
      NETWORKS: "1"
      NODES: "0"
      PLUGINS: "0"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VOLUMES: "0"
      # The health check uses the harmless Docker ping endpoint.
      PING: "1"
      VERSION: "1"
    networks:
      # Only Alloy and CrowdSec can reach the proxy on this internal network.
      - docker_api
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    healthcheck:
      # A successful local ping confirms the proxy can answer read requests.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ============================================================================
  # Visual Operations & Security Dashboard (Grafana)
  # Security: bound to 127.0.0.1 (loopback only) away from public internet,
  # admin password injected via Docker secret, automatic provisioning.
  # ============================================================================
  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    container_name: kura-grafana
    restart: unless-stopped
    ports:
      # Published on loopback only, so it cannot be reached from any network
      # interface. The host-layer step re-binds it to the NetBird (wt0) address.
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      # No anonymous browsing and no self sign-up: only the admin account exists.
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      # No outbound phone-home: usage reporting and update checks go to Grafana Labs.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Grafana is reached through the SSH tunnel as plain localhost, so HTTPS
      # would break the cookie on http://localhost. The tunnel encrypts it.
      GF_SECURITY_COOKIE_SECURE: "false"
      # Logs go to the container output where Alloy collects them.
      GF_LOG_MODE: console
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    secrets:
      - grafana_admin_password
    networks:
      - observability
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ============================================================================
  # Zero-Trust WireGuard Overlay Service (NetBird Client)
  # Security: establishes an encrypted peer-to-peer WireGuard mesh connecting
  # administrators directly to internal monitoring and management interfaces.
  # Keeps Grafana (3000) and Prometheus (9090) invisible to the public internet.
  # ============================================================================
  netbird:
    # Only started with "docker compose --profile remote-access up -d", once the
    # NetBird server and setup key exist. See docker/netbird/README.md.
    profiles: ["remote-access"]
    image: netbirdio/netbird:0.82.0@sha256:eca5b274c635bfbb04ec6724a0712d1146190dd450eea199eeb83916fdd94965
    container_name: kura-netbird
    restart: unless-stopped
    network_mode: host
    # The self-hosted server's name, reached through netbird-proxy on this host.
    extra_hosts:
      - "netbird.kura.lan:127.0.0.1"
    environment:
      # Kura's own NetBird server (netbird-server / netbird-proxy above).
      NB_MANAGEMENT_URL: "https://netbird.kura.lan"
      # Joins the "Kura servers" group (setup-netbird.sh wrote this key).
      NB_SETUP_KEY_FILE: /run/secrets/netbird_setup_key
      NB_HOSTNAME: kura-vm
      NB_LOG_LEVEL: info
      # NetBird has no "trust this CA" option; Go programs read SSL_CERT_FILE,
      # so the client trusts exactly Kura's CA (which signed netbird.kura.lan).
      SSL_CERT_FILE: /etc/kura/ca.crt
    volumes:
      - /lib/modules:/lib/modules:ro
      - netbird_data:/var/lib/netbird
      - ./certs/internal/ca.crt:/etc/kura/ca.crt:ro
    secrets:
      - netbird_setup_key
    cap_drop:
      - ALL
    # NET_ADMIN: create the wt0 VPN interface and routes. NET_RAW: the raw
    # socket WireGuard uses (refused without it: "failed to create ipv4 raw
    # socket"). SYS_MODULE: load the wireguard kernel module if missing.
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  # ============================================================================
  # Secrets & Cryptographic Management (HashiCorp Vault)
  # Encrypts authenticator (TOTP) seeds with its Transit engine; Django only
  # ever stores the ciphertext. HTTPS only (certificate from our internal CA).
  # Set up once with docker/vault/init-vault.sh, and unsealed by hand after
  # each restart (see docker/vault/README.md). Isolated on backend.
  # ============================================================================
  vault:
    image: hashicorp/vault:2.2.1@sha256:962a92876e168d68eaaa24b0b8b49bbce1cb63024060a67bba95cd158a366fc2
    container_name: kura-vault
    restart: unless-stopped
    command: server
    read_only: true
    tmpfs:
      - /tmp:size=16M,mode=1777
    environment:
      # Used by the vault command line tool inside the container (setup,
      # unseal, health check): talk HTTPS to itself and check the certificate.
      VAULT_ADDR: "https://127.0.0.1:8200"
      VAULT_CACERT: "/vault/tls/ca.crt"
      VAULT_CONFIG_DIR: "/vault/config"
    volumes:
      - ./docker/vault/config/vault.hcl:/vault/config/vault.hcl:ro
      # The "kura-web" policy that init-vault.sh loads into Vault.
      - ./docker/vault/policies:/vault/policies:ro
      # Only Vault's own certificate and key, plus the CA certificate.
      - ./certs/internal/ca.crt:/vault/tls/ca.crt:ro
      - ./certs/internal/vault.crt:/vault/tls/vault.crt:ro
      - ./certs/internal/vault.key:/vault/tls/vault.key:ro
      - vault_data:/vault/file
    networks:
      - backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    healthcheck:
      # "vault status" exits 0 when unsealed and 2 when sealed. Both mean the
      # server is running; a sealed Vault is reported by the alerts (stage 6).
      test: ["CMD-SHELL", "vault status > /dev/null; [ $$? -le 2 ]"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

# ==============================================================================
# Isolated Networks
# frontend: for reverse proxy (Nginx) and external traffic ingress
# app: only the WAF and Django (internal: true), so the WAF cannot be skipped
# backend: strictly internal network (internal: true); no internet access
# observability: isolated metrics and log collection network
# ==============================================================================
networks:
  frontend:
    driver: bridge
    # Fixed subnet so Nginx and cloudflared can have fixed addresses, which the
    # real-client-IP settings in Nginx and the WAF depend on.
    ipam:
      config:
        - subnet: 172.28.10.0/24
          # Automatic addresses come only from .128-.255, so they can never
          # clash with the fixed ones (.10 cloudflared, .20 nginx).
          ip_range: 172.28.10.128/25
  # Only the WAF and Django. internal: no internet route.
  app:
    driver: bridge
    internal: true
  backend:
    driver: bridge
    internal: true
  observability:
    driver: bridge
  # Only the Docker API proxy, Alloy and CrowdSec may reach this internal network.
  docker_api:
    driver: bridge
    internal: true
  # Django -> mail relay only. internal: no internet. Fixed subnet because the
  # relay's main.cf only accepts mail from 172.28.30.0/24.
  mail:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.30.0/24
  # The relay's outbound route to the mail provider (nothing else joins it).
  mail_egress:
    driver: bridge
  # The NetBird server, its dashboard and its TLS proxy. Fixed subnet because
  # netbird-server trusts forwarded addresses only from the proxy at .10.
  netbird:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.40.0/24
          ip_range: 172.28.40.128/25
  # Django <-> ClamAV only (INSTREAM is plain TCP; internal: no internet route; CFG-06).
  clamav:
    driver: bridge
    internal: true
  # Outbound-only route for ClamAV signature updates (nothing else joins it).
  clamav_updates:
    driver: bridge
  # Django -> breach-check proxy only. internal: no internet. Fixed subnet
  # because tinyproxy.conf only accepts clients from 172.28.50.0/24.
  breach_check:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.50.0/24
  # The breach-check proxy's outbound route (nothing else joins it).
  breach_check_egress:
    driver: bridge

# ==============================================================================
# Persistent Named Volumes
# ==============================================================================
volumes:
  postgres_data:
    # Keep pgEdge on a fresh volume. The similarly named kura_postgres_data
    # volume is an older cluster and does not use the pgEdge data-directory layout.
    name: kura_pgedge_postgres_data
  static_data:
    name: kura_static_data
  clamav_db:
    name: kura_clamav_db
  crowdsec_data:
    name: kura_crowdsec_data
  crowdsec_config:
    name: kura_crowdsec_config
  loki_data:
    name: kura_loki_data
  # Alloy's persistent positions let it resume reading without replaying history.
  alloy_data:
    name: kura_alloy_data
  prometheus_data:
    name: kura_prometheus_data
  grafana_data:
    name: kura_grafana_data
  netbird_data:
    name: kura_netbird_data
  vault_data:
    name: kura_vault_data
  postgres_backups:
    name: kura_postgres_backups
  relay_queue:
    name: kura_relay_queue
  netbird_server_data:
    name: kura_netbird_server_data
  netbird_server_tmp:
    name: kura_netbird_server_tmp

