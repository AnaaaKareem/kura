# The Compose project is always "kura", whatever the folder is called.
# Alloy (docker/alloy/config.alloy) only collects logs from containers of the "kura" project named kura-*, so a different project name would lose logs.
name: kura

# Log rotation for every service: Docker's json-file driver keeps at most five 10 MB files per container, so container logs cannot fill the VM's disk.
# Alloy and CrowdSec read these logs through the Docker API, which works the same with rotation.
# Loki keeps the 180-day copy.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # PostgreSQL 17 uses the pgEdge image with pgAudit and pgBackRest on an internal network.
  # Protect it with a read-only root, limited capabilities, Docker secrets, mTLS and resource limits.
  db:
    image: ghcr.io/pgedge/pgedge-postgres:17-spock5-standard@sha256:6d2fb528a11a059d07247e38b38e601a3795d1ab2bfd78ad945f9e77227c0a15
    logging: *default-logging
    container_name: kura-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    read_only: true
    # Writable in-memory RAM partitions: temp files, PostgreSQL Unix sockets (used by the health check and pgBackRest), and pgBackRest log files.
    tmpfs:
      - /tmp:size=128M,mode=1777
      - /var/run/postgresql:size=16M,mode=1777
      - /var/log/pgbackrest:size=64M,mode=1777
    volumes:
      # pgEdge layout: the cluster lives in /var/lib/pgsql/17/data (the image pre-creates this path with the correct postgres ownership).
      - postgres_data:/var/lib/pgsql/17/data
      # pgBackRest WAL archive and backup repository storage (repo1 primary, repo2 off-site mount).
      - postgres_backups:/var/lib/pgbackrest
      - "${KURA_OFFSITE_BACKUP_DIR:-postgres_backups_offsite}:/var/lib/pgbackrest-offsite"
      # Mutual TLS: PostgreSQL's own certificate and key, plus the CA certificate used to check client certificates.
      # Only these three files are mounted, so this container never sees another service's key or the CA private key.
      - ./certs/internal/ca.crt:/var/lib/postgresql/certs/ca.crt:ro
      - ./certs/internal/db.crt:/var/lib/postgresql/certs/db.crt:ro
      - ./certs/internal/db.key:/var/lib/postgresql/certs/db.key:ro
      # Runs once on first start: creates the least-privilege roles and grants.
      - ./docker/postgres/init-roles.sql:/docker-entrypoint-initdb.d/01-init-roles.sql:ro
      # pgBackRest configuration and wrapper (supplies PGBACKREST_REPO1_CIPHER_PASS from Docker secret).
      - ./docker/postgres/pgbackrest.conf:/etc/pgbackrest/pgbackrest.conf:ro
      - ./docker/postgres/entrypoint.sh:/usr/local/bin/kura-db-entrypoint.sh:ro
      - ./docker/postgres/pgbackrest-wrapper.sh:/usr/local/bin/pgbackrest:ro
      # Backup and restore operators available inside the container.
      - ./docker/postgres/backup.sh:/usr/local/bin/backup.sh:ro
      - ./docker/postgres/restore.sh:/usr/local/bin/restore.sh:ro
      # Custom PostgreSQL server configuration (SSL/mTLS, WAL archiving, pgAudit).
      - ./docker/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./docker/postgres/pgaudit.conf:/etc/postgresql/pgaudit.conf:ro
      # Client authentication rules (certificate + password policies).
      - ./docker/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    networks:
      - backend
    secrets:
      - db_password
      - backup_encryption_key
    environment:
      # Standard official-style entrypoint variables supported by the pgEdge image.
      POSTGRES_DB: kura
      POSTGRES_USER: kura-admin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      # UTF-8 database with page checksums (the image defaults to a C locale).
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale=C.UTF-8 --data-checksums
      PGDATA: /var/lib/pgsql/17/data
    # Wrap the image entrypoint so PostgreSQL exports PGBACKREST_REPO1_CIPHER_PASS from /run/secrets/backup_encryption_key for archive_command/restore_command.
    entrypoint: ["/usr/local/bin/kura-db-entrypoint.sh"]
    # Point the server at the mounted configuration and authentication files, overriding the default copies generated inside the data directory.
    command:
      - postgres
      - -c
      - config_file=/etc/postgresql/postgresql.conf
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    # Drop all Linux capabilities and only retain minimal permissions required for the entrypoint to set data folder ownership and drop to user postgres
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    # Resource limits to prevent denial-of-service / resource starvation
    mem_limit: 1536m
    cpus: 1.5
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
        reservations:
          cpus: "0.5"
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kura-admin -d kura"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Run Django on Gunicorn as kura (UID 10001) with a read-only root and no capabilities.
  # Use Docker secrets and limit memory and CPU use.
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: kura-web:latest
    logging: *default-logging
    container_name: kura-web
    restart: unless-stopped
    read_only: true
    # Writable in-memory RAM partitions for Python temporary files and runtime sockets
    tmpfs:
      - /tmp:size=256M,mode=1777
      - /run:size=16M,mode=1777
      # Writable state for Gunicorn's control server on a read-only filesystem
      - /app/.gunicorn:size=16M,mode=1777
    volumes:
      # Static files are baked into the nginx image at build time (Dockerfile); this volume is gone.
      # Only Django's own certificate and key, plus the CA certificate.
      - ./certs/internal/ca.crt:/certs/internal/ca.crt:ro
      - ./certs/internal/web.crt:/certs/internal/web.crt:ro
      - ./certs/internal/web.key:/certs/internal/web.key:ro
      # Migration key (readable only by root and group 10002). Used only at start-up,
      # then Gunicorn runs without that group and can never read it.
      - ./certs/internal/migrator.crt:/certs/internal/migrator.crt:ro
      - ./certs/internal/migrator.key:/certs/internal/migrator.key:ro
    # app: only the WAF can reach Django, so the WAF cannot be bypassed.
    # backend: so Django can reach PostgreSQL and Vault.
    # clamav: internal network shared only with ClamAV (INSTREAM is plain TCP; CFG-06).
    # egress: the only route to the internet. The host firewall (docker/nftables/kura.nft) lets
    # this address reach only Gmail SMTP on port 587 and HaveIBeenPwned on port 443, plus one DNS resolver.
    # No other container joins it, and web opens no inbound port.
    networks:
      app:
      backend:
      clamav:
      egress:
        ipv4_address: 172.28.60.10
    # DNS: only the one resolver the firewall allows web to reach.
    dns:
      - 1.1.1.1
    # No db_password here: that is the kura-admin (superuser) password.
    # Django logs in as kura_app with its certificate, so it never needs it.
    # If Django were ever broken into, the attacker must not find the superuser password.
    # Migrations run in the kura-migrate service as kura_migrator before Gunicorn starts.
    secrets:
      - django_secret_key
    environment:
      DEBUG: "False"
      # Gunicorn worker processes (gunicorn.conf.py).
      # The load test made the 3-worker default CPU-bound at about 36 requests per second; 5 workers use the 2 CPUs better and stay well inside the 2 GB memory limit.
      GUNICORN_WORKERS: "5"
      DATABASE_NAME: kura
      # Django logs in as temporary users from Vault (15 minutes each, members of the least-privilege role kura_app), not a fixed account.
      # See kura/base.py.
      # Migrations run in the kura-migrate service as kura_migrator (DATABASE_USER=kura_migrator).
      VAULT_DATABASE_CREDENTIALS: "True"
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      # KURA_PUBLIC_HOSTNAME is the public host name visitors type, which points at the VM's address.
      # Set it in .env on the server (e.g. KURA_PUBLIC_HOSTNAME=kura.yourdomain.com).
      ALLOWED_HOSTS: "localhost,127.0.0.1,web,${KURA_PUBLIC_HOSTNAME:-kura.example.com}"
      CLAMAV_HOST: "clamav"
      CLAMAV_PORT: "3310"
      CLAMAV_REQUIRED: "True"
      # HTTPS: Django checks Vault's certificate against our internal CA.
      VAULT_URL: "https://vault:8200"
      VAULT_CA_CERT: "/certs/internal/ca.crt"
      VAULT_ENABLED: "True"
      MTLS_ENABLED: "True"
      # Trust the WAF's X-Real-IP header for the visitor's IP.
      # Safe only because MTLS_ENABLED makes Gunicorn require a client certificate, and Django is only reachable from the WAF (app network).
      # See config/settings.py.
      TRUST_PROXY_IP_HEADER: "True"
      # Email: Django sends mail straight to Gmail (STARTTLS, port 587). Django checks Google's certificate against the public CA list.
      EMAIL_HOST: "smtp.gmail.com"
      EMAIL_PORT: "587"
      EMAIL_USE_TLS: "True"
      EMAIL_HOST_USER: "${KURA_GMAIL_ADDRESS:-kuralmsedu@gmail.com}"
      DEFAULT_FROM_EMAIL: "Kura <${KURA_GMAIL_ADDRESS}>"
      # Breached-password check: HaveIBeenPwned directly over HTTPS, restricted by the host egress allowlist.
      # See config/settings.py.
      # Links in emails always point here (never at the Host header a visitor sent).
      SITE_URL: "https://${KURA_PUBLIC_HOSTNAME:-kura.example.com}"
      DB_SSL_MODE: "verify-full"
      DB_SSL_ROOTCERT: "/certs/internal/ca.crt"
      DB_SSL_CERT: "/certs/internal/web.crt"
      DB_SSL_KEY: "/certs/internal/web.key"
      # Vault AppRole login for Django (credentials from environment; no Docker secret files needed).
      VAULT_ROLE_ID: "1e2b5b2e-6590-6ba0-8c4b-24fbd83d1ece"
      VAULT_SECRET_ID: "16fdc08c-7255-275f-9067-bbea747ca06f"
    # Runs as nonroot:nonroot (distroless built-in user). No entrypoint, no setpriv,
    # no capability changes needed. Gunicorn reads cert key files directly.
    user: "nonroot:nonroot"
    command: ["/python/bin/gunicorn", "-c", "gunicorn.conf.py", "config.wsgi:application"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Resource limits
    mem_limit: 2048m
    cpus: 2.0
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    # Django needs the database and Vault (for its database login).
    depends_on:
      kura-migrate:
        condition: service_completed_successfully
      db:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/python/bin/python3", "-c", "import os, ssl, urllib.request; mtls = os.environ.get('MTLS_ENABLED', 'False').lower() in ('true', '1'); ctx = ssl.create_default_context(ssl.Purpose.SERVER_AUTH, cafile='/certs/internal/ca.crt') if mtls else None; ctx.load_cert_chain('/certs/internal/web.crt', '/certs/internal/web.key') if mtls else None; ctx.check_hostname = False if mtls else None; urllib.request.urlopen('https://127.0.0.1:8443/login/' if mtls else 'http://127.0.0.1:8000/login/', context=ctx)"]
      interval: 15s
      timeout: 5s
      start_period: 60s

  # Runs database migrations as kura_migrator before the web service starts.
  # Uses the same distroless runtime image but runs manage.py migrate directly,
  # then exits. No entrypoint, no setpriv — Django's manage.py handles the
  # DATABASE_USER=kura_migrator login via environment.
  kura-migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: kura-web:latest
    container_name: kura-migrate
    read_only: true
    tmpfs:
      - /tmp:size=256M,mode=1777
    volumes:
      - ./certs/internal/ca.crt:/certs/internal/ca.crt:ro
      - ./certs/internal/migrator.crt:/certs/internal/migrator.crt:ro
      - ./certs/internal/migrator.key:/certs/internal/migrator.key:ro
    environment:
      DEBUG: "False"
      DATABASE_NAME: kura
      DATABASE_USER: kura_migrator
      VAULT_DATABASE_CREDENTIALS: "False"
      VAULT_ENABLED: "False"
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DB_SSL_MODE: "verify-full"
      DB_SSL_ROOTCERT: "/certs/internal/ca.crt"
      DB_SSL_CERT: "/certs/internal/migrator.crt"
      DB_SSL_KEY: "/certs/internal/migrator.key"
    depends_on:
      db:
        condition: service_healthy
      vault:
        condition: service_healthy
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    command: ["/python/bin/python3", "manage.py", "migrate", "--noinput"]

  # Nginx Alpine accepts TLS 1.3 only, with HSTS, rate limits, a 25MB body limit and hidden server tokens.
  # Keep its root read-only, drop capabilities and isolate it on the frontend network.
  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx
    image: kura-nginx:latest
    logging: *default-logging
    container_name: kura-nginx
    restart: unless-stopped
    read_only: true
    # Writable in-memory RAM partitions for cache, process IDs, and temp buffers
    tmpfs:
      - /var/cache/nginx:size=64M,mode=1777
      - /var/run:size=16M,mode=1777
      - /tmp:size=64M,mode=1777
      # Nginx renders the virtual host template into this writable in-memory directory.
      - /etc/nginx/conf.d:size=1M,mode=0755
    environment:
      # Substitute only the configured host; leave nginx variables unchanged.
      KURA_PUBLIC_HOSTNAME: "${KURA_PUBLIC_HOSTNAME:-kura.example.com}"
      NGINX_ENVSUBST_FILTER: "^KURA_PUBLIC_HOSTNAME$"
    # The only ports published on every interface: visitors connect here directly.
    # Port 80 only redirects to HTTPS (docker/nginx/conf.d/kura.conf).
    # The host firewall (docker/nftables/kura.nft) allows 80 and 443 in.
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/conf.d/kura.conf:/etc/nginx/templates/kura.conf.template:ro
      # Public HTTPS certificate, then Nginx's own internal mTLS files.
      - ./certs/kura.crt:/etc/nginx/certs/kura.crt:ro
      - ./certs/kura.key:/etc/nginx/certs/kura.key:ro
      - ./certs/internal/ca.crt:/etc/nginx/certs/internal/ca.crt:ro
      - ./certs/internal/nginx.crt:/etc/nginx/certs/internal/nginx.crt:ro
      - ./certs/internal/nginx.key:/etc/nginx/certs/internal/nginx.key:ro
    networks:
      frontend:
        # Fixed address: the WAF trusts the X-Real-IP header only from here.
        ipv4_address: 172.28.10.20
    # Drop all kernel capabilities and only retain minimal permissions for binding and worker user switching
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    # Resource limits to prevent DoS
    mem_limit: 512m
    cpus: 1.0
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M
    depends_on:
      - waf
    healthcheck:
      # Probing port 443 exercises the complete chain:
      # TLS termination here, then Nginx -> WAF -> Django, both over mutual TLS.
      test: ["CMD-SHELL", "wget -q --no-check-certificate --spider https://127.0.0.1:443/login/ || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 5s

  # Web Application Firewall Service (Coraza WAF with OWASP Core Rule Set v4) Request path: Nginx --mTLS--> WAF --mTLS--> Django.
  # Security: blocks at CRS anomaly score 5 (paranoia 1, detection-only at 2), accepts only Nginx's client certificate, read-only root, runs as the image's unprivileged "nginx" user with no capabilities.
  # All configuration is in docker/coraza/ (see the README there).
  waf:
    image: ghcr.io/coreruleset/coraza-crs:nginx@sha256:0089154673011788070e7b7591b62dd8e7a6686d4e6ba75ad92947b97d54799a
    logging: *default-logging
    container_name: kura-waf
    restart: unless-stopped
    read_only: true
    # The image's start-up script writes generated config files, which a read-only container cannot do.
    # We mount finished config files instead and start nginx directly.
    entrypoint: ["nginx", "-c", "/etc/coraza/nginx.conf", "-g", "daemon off;"]
    # Writable in-memory folders for nginx temp files and Coraza's work files.
    tmpfs:
      - /tmp:size=128M,mode=1777
      - /var/cache/nginx:size=64M,mode=1777
    volumes:
      - ./docker/coraza/nginx.conf:/etc/coraza/nginx.conf:ro
      - ./docker/coraza/coraza-rules.conf:/etc/coraza/coraza-rules.conf:ro
      - ./docker/coraza/coraza.conf:/etc/coraza/coraza.conf:ro
      - ./docker/coraza/kura-crs-setup.conf:/etc/coraza/kura-crs-setup.conf:ro
      - ./docker/coraza/rules.d:/etc/coraza/rules.d:ro
      # Only the WAF's own certificate and key, plus the CA certificate.
      - ./certs/internal/ca.crt:/certs/internal/ca.crt:ro
      - ./certs/internal/waf.crt:/certs/internal/waf.crt:ro
      - ./certs/internal/waf.key:/certs/internal/waf.key:ro
    # frontend: Nginx connects in. app: the WAF connects on to Django.
    networks:
      - frontend
      - app
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Resource limits to prevent DoS. 768 MB: under the load test the WAF used 496 of 512 MB (CRS rules and request buffers), too close to being killed.
    mem_limit: 768m
    cpus: 1.0
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
        reservations:
          cpus: "0.2"
          memory: 128M
    depends_on:
      - web
    healthcheck:
      # Loopback-only health endpoint inside the WAF (docker/coraza/nginx.conf).
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 10s

  # The official multi-architecture ClamAV image scans uploads in memory over INSTREAM on port 3310.
  # Keep it isolated with no public ports, a read-only root, persistent signatures and resource limits.
  clamav:
    image: clamav/clamav-debian:1.5.4@sha256:c21aa18cc0a358678255a3dfb343a4555b58f71b97d7b869df8fdf7ea0a5b4b1
    logging: *default-logging
    container_name: kura-clamav
    restart: unless-stopped
    read_only: true
    # Start as the scanner user without granting root capabilities.
    user: "1000:1000"
    entrypoint: /init-unprivileged
    # Scanner sockets and logs need writable temporary storage.
    tmpfs:
      - /tmp:size=128M,mode=1777
      - /var/log/clamav:size=16M,uid=1000,gid=1000,mode=0750
    volumes:
      - clamav_db:/var/lib/clamav
      # Kura's scanner settings: reject encrypted files, Office macros and files too large/deep to scan (see docker/clamav/clamd.conf).
      - ./docker/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    # clamav: internal network shared only with web because INSTREAM is plain TCP (CFG-06).
    # clamav_updates: lets freshclam download new virus signatures from the internet (clamav is internal and has no internet route).
    # No other container is on either network, so Nginx, WAF, DB and Vault cannot reach ClamAV.
    networks:
      - clamav
      - clamav_updates
    # Drop all kernel capabilities
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # ClamAV signature database requires around 1-1.5 GB memory
    mem_limit: 1536m
    cpus: 1.0
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1536M
        reservations:
          cpus: "0.2"
          memory: 512M
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s

  # CrowdSec monitors Nginx access/error logs for brute force and web attacks.
  # It sends 4-hour bans to the host's nftables bouncer.
  crowdsec:
    image: crowdsecurity/crowdsec:v1.8.2@sha256:65b74942f7e7ed5c60fde4ac15fc4ba715904c398c8b16dd451f4907d90347d4
    logging: *default-logging
    container_name: kura-crowdsec
    restart: unless-stopped
    ports:
      # Exposes Local API on loopback only for the firewall bouncer
      - "127.0.0.1:8085:8080"
    environment:
      # crowdsecurity/linux adds the base parsers the others depend on.
      # crowdsecurity/sshd bans SSH brute force found in the VM's auth log.
      COLLECTIONS: "crowdsecurity/linux crowdsecurity/sshd crowdsecurity/nginx crowdsecurity/http-cve crowdsecurity/base-http-scenarios"
    volumes:
      - ./docker/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - ./docker/crowdsec/profiles.yaml:/etc/crowdsec/profiles.yaml:ro
      # The VM's SSH log, read-only, for the crowdsecurity/sshd scenarios.
      # Ubuntu Server's rsyslog writes it; it must exist before the stack starts.
      - /var/log/auth.log:/var/log/host/auth.log:ro
      # Turns on Prometheus metrics on :6060 for Alloy (WP3).
      - ./docker/crowdsec/config.yaml.local:/etc/crowdsec/config.yaml.local:ro
      # Kura's own parsers, whitelist and scenarios (docker/crowdsec/README.md).
      - ./docker/crowdsec/parsers/kura-django-logfmt.yaml:/etc/crowdsec/parsers/s01-parse/kura-django-logfmt.yaml:ro
      - ./docker/crowdsec/parsers/kura-coraza-audit.yaml:/etc/crowdsec/parsers/s01-parse/kura-coraza-audit.yaml:ro
      - ./docker/crowdsec/parsers/kura-whitelist.yaml:/etc/crowdsec/parsers/s02-enrich/kura-whitelist.yaml:ro
      - ./docker/crowdsec/scenarios/login-bruteforce.yaml:/etc/crowdsec/scenarios/kura-login-bruteforce.yaml:ro
      - ./docker/crowdsec/scenarios/mfa-bruteforce.yaml:/etc/crowdsec/scenarios/kura-mfa-bruteforce.yaml:ro
      - ./docker/crowdsec/scenarios/idor-probing.yaml:/etc/crowdsec/scenarios/kura-idor-probing.yaml:ro
      - ./docker/crowdsec/scenarios/waf-repeat-offender.yaml:/etc/crowdsec/scenarios/kura-waf-repeat-offender.yaml:ro
      - ./docker/crowdsec/scenarios/reset-abuse.yaml:/etc/crowdsec/scenarios/kura-reset-abuse.yaml:ro
      - crowdsec_data:/var/lib/crowdsec/data
      - crowdsec_config:/etc/crowdsec
    # The image registers a bouncer from each /run/secrets/bouncer_key_<name> file, so the
    # host bouncer is "firewall" with the generated key. A BOUNCER_KEY_* variable is taken
    # literally, so pointing one at a file path made the path itself the key.
    secrets:
      - source: crowdsec_bouncer_key
        target: bouncer_key_firewall
    # No "frontend": CrowdSec reads every log through the Docker API proxy and needs no access to nginx or the WAF over the network.
    networks:
      - observability
      # Gives CrowdSec read-only access to container logs through the proxy.
      - docker_api
    # Hardened like the other services.
    # CrowdSec writes only to its two volumes (/etc/crowdsec, /var/lib/crowdsec/data) and /tmp.
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Resource limits to prevent DoS
    mem_limit: 512m
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    depends_on:
      - nginx
    healthcheck:
      # Check that CrowdSec can authenticate to its own Local API.
      test: ["CMD", "cscli", "lapi", "status"]
      interval: 15s
      timeout: 5s
      start_period: 15s

  # NOTE: the CrowdSec nftables firewall bouncer is NOT a container.
  # CrowdSec publishes it as a Linux host package (crowdsec-firewall-bouncer-nftables), not as a Docker image, so it is installed on the host in the host-layer step.
  # It reads bans from the CrowdSec Local API on 127.0.0.1:8085 (published above).

  # Loki stores logs on an internal network with 180-day retention (4320h).
  # The retention period follows Egyptian Law No. 175 and the LMS specification.
  loki:
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    logging: *default-logging
    container_name: kura-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki.yml
    volumes:
      - ./docker/loki/loki.yml:/etc/loki/loki.yml:ro
      - ./docker/loki/rules:/etc/loki/rules:ro
      - loki_data:/var/loki
    networks:
      - observability
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    # No Docker health check: the Loki image has no shell, wget or curl, so a check inside the container can never run (it only ever reported "unhealthy").
    # Instead Alloy probes http://loki:3100/ready from outside (prometheus.exporter.blackbox in docker/alloy/config.alloy), and the ServiceDown / LokiNotReady alerts fire if it stops answering.

  # Prometheus collects internal metrics and evaluates security alerts on the observability network.
  # It publishes no public ports.
  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    logging: *default-logging
    container_name: kura-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=180d
      - --web.enable-lifecycle
      # Alloy forwards scraped samples to this Prometheus remote-write endpoint.
      - --web.enable-remote-write-receiver
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - observability
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 15s

  # Alertmanager groups operational alerts for Telegram using Docker secrets.
  # The observability network supplies its route to Telegram.
  alertmanager:
    image: prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b
    logging: *default-logging
    container_name: kura-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./docker/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    secrets:
      - telegram_bot_token
      - telegram_chat_id
    networks:
      - observability
    read_only: true
    tmpfs:
      - /alertmanager:size=32M,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.2
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9093/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s

  # Alloy collects Nginx logs and telemetry for Loki and Prometheus.
  # Read-only log access, isolated on observability network.
  alloy:
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    logging: *default-logging
    container_name: kura-alloy
    # Match the image's data-directory owner when capabilities are dropped.
    user: "473:473"
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    environment:
      # The public site address that the "site" probe checks end to end.
      KURA_PUBLIC_HOSTNAME: "${KURA_PUBLIC_HOSTNAME:-kura.example.com}"
    read_only: true
    tmpfs:
      # Alloy's temporary files stay in memory on its read-only filesystem.
      - /tmp:size=32M,mode=1777
    volumes:
      - ./docker/alloy/config.alloy:/etc/alloy/config.alloy:ro
      # Alloy trusts Vault's HTTPS server certificate using only the public CA.
      - ./certs/internal/ca.crt:/etc/alloy/certs/ca.crt:ro
      # Alloy's own client certificate and key, for its PostgreSQL monitoring login.
      - ./certs/internal/alloy.crt:/etc/alloy/certs/alloy.crt:ro
      - ./certs/internal/alloy.key:/etc/alloy/certs/alloy.key:ro
      # Keep log offsets across restarts so old logs are not replayed.
      - alloy_data:/var/lib/alloy/data
      # Script-health and app-metric files written by the cron jobs (WP11).
      # Set KURA_METRICS_DIR=/var/lib/kura-metrics in .env on the VM.
      - ${KURA_METRICS_DIR:-./var/metrics}:/var/lib/kura-metrics:ro
      # Host cron job logs (/var/log/kura/*.log), mounted read-only into Alloy.
      - ${KURA_LOG_DIR:-./var/log/kura}:/var/log/kura:ro
      # Host CPU, memory, disk and network figures, read-only (WP3).
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    # Group 4 is "adm" on Ubuntu: lets Alloy read /var/log/auth.log (root:adm, mode 640) through the read-only host mount, for the SSH login alerts.
    group_add:
      - "4"
    networks:
      - observability
      # Docker log access is limited by the internal socket-proxy network.
      - docker_api
      # WP3 metrics are scraped from Vault and other internal services here.
      - backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Ready when Alloy's own HTTP server answers /-/ready.
    # The image has bash but no curl or wget, so bash's /dev/tcp sends the request.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q ' 200 '"]
      timeout: 5s
      start_period: 20s
    mem_limit: 256m
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    depends_on:
      - loki
      - prometheus

  # Read-only Docker API proxy for Alloy and CrowdSec.
  # Tecnativa versions through 0.5.0 have CVE-2026-78122; its fix was still an open pull request on 2026-11-06.
  # LinuxServer's compatible image has a separate ALLOW_LOGS control for Alloy without other filesystem access.
  # Image version 3.4.7, released 2026-10-27; checked 2026-11-06.
  docker-api-proxy:
    image: lscr.io/linuxserver/socket-proxy:3.4.7@sha256:4e5e59efd3338205561c54262581992036e5a36ccca97d487b1d4ec41f9adc58
    logging: *default-logging
    container_name: kura-docker-api-proxy
    restart: unless-stopped
    read_only: true
    tmpfs:
      # The proxy writes its generated HAProxy configuration under /run.
      - /run:size=16M,mode=1777
    volumes:
      # The socket is the proxy's only route to Docker; ACLs below limit requests.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    # The upstream image needs root inside the container to read the Docker socket.
    environment:
      # Alloy needs only container and network listing, log reads, and Docker event updates.
      CONTAINERS: "1"
      EVENTS: "1"
      ALLOW_LOGS: "1"
      POST: "0"
      # Explicitly deny archive, export, and filesystem-change inspection.
      ALLOW_ARCHIVE: "0"
      ALLOW_CHANGES: "0"
      ALLOW_EXPORT: "0"
      ALLOW_PAUSE: "0"
      ALLOW_RESTARTS: "0"
      ALLOW_START: "0"
      ALLOW_STOP: "0"
      ALLOW_TOP: "0"
      ALLOW_UNPAUSE: "0"
      # Disable Docker API sections that are not needed for log collection.
      AUTH: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      EXEC: "0"
      IMAGES: "0"
      # CrowdSec's Docker log source calls GET /info when it starts and exits if refused (it crashed in a loop with INFO=0).
      # Read-only system facts.
      INFO: "1"
      # Alloy's Docker discovery also lists networks (to label containers by network); without this every discovery refresh failed with 403 and no container logs reached Loki.
      # Read-only: POST=0 still blocks any change.
      NETWORKS: "1"
      NODES: "0"
      PLUGINS: "0"
      SECRETS: "0"
      SERVICES: "0"
      SESSION: "0"
      SWARM: "0"
      SYSTEM: "0"
      TASKS: "0"
      VOLUMES: "0"
      # The health check uses the harmless Docker ping endpoint.
      PING: "1"
      VERSION: "1"
    networks:
      # Only Alloy and CrowdSec can reach the proxy on this internal network.
      - docker_api
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.05"
          memory: 32M
    healthcheck:
      # A successful local ping confirms the proxy can answer read requests.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 15s
      timeout: 5s
      start_period: 10s

  # Grafana binds to 127.0.0.1 with provisioned dashboards and an admin password from a Docker secret.
  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    logging: *default-logging
    container_name: kura-grafana
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64M,mode=1777
    ports:
      # Published on the host's loopback address only.
      # Admins reach it through an SSH tunnel: ssh -N -L 3000:127.0.0.1:3000 <admin>@<vm> (docker/grafana/README.md).
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      # No anonymous browsing, no self sign-up and no new organisations: only the admin account and the read-only "viewer" (./kura.sh grafana-users).
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      # No HTTP basic auth on the API: every login goes through the login form, which has brute-force protection (5 failures lock the account briefly).
      GF_AUTH_BASIC_ENABLED: "false"
      GF_SECURITY_DISABLE_BRUTE_FORCE_LOGIN_PROTECTION: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      # No outbound phone-home: usage reporting and update checks go to Grafana Labs.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # The session cookie is Secure and SameSite=Strict.
      # Browsers treat
      # http://localhost as a secure context, so the cookie still works through
      # the SSH tunnel (which encrypts the traffic).
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_COOKIE_SAMESITE: strict
      # Logs go to the container output where Alloy collects them.
      GF_LOG_MODE: console
      # Log every HTTP request (method, path, status, user name; never the body), so successful logins (POST /login, status 200) reach Loki as well as failed ones, for the Grafana login alerts in docker/loki/rules.
      GF_SERVER_ROUTER_LOGGING: "true"
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    secrets:
      - grafana_admin_password
    networks:
      - observability
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 15s

  # Secrets & Cryptographic Management (HashiCorp Vault) Encrypts authenticator (TOTP) seeds with its Transit engine; Django only ever stores the ciphertext. HTTPS only (certificate from our internal CA).
  # Set up once with ./kura.sh vault-init, and unsealed by hand after each restart (see docker/vault/README.md).
  # Isolated on backend.
  vault:
    image: hashicorp/vault:2.2.1@sha256:962a92876e168d68eaaa24b0b8b49bbce1cb63024060a67bba95cd158a366fc2
    logging: *default-logging
    container_name: kura-vault
    restart: unless-stopped
    command: server
    read_only: true
    tmpfs:
      - /tmp:size=16M,mode=1777
    environment:
      # Used by the vault command line tool inside the container (setup, unseal, health check): talk HTTPS to itself and check the certificate.
      VAULT_ADDR: "https://127.0.0.1:8200"
      VAULT_CACERT: "/vault/tls/ca.crt"
      VAULT_CONFIG_DIR: "/vault/config"
    volumes:
      - ./docker/vault/config/vault.hcl:/vault/config/vault.hcl:ro
      # The "kura-web" policy that ./kura.sh vault-init loads into Vault.
      - ./docker/vault/policies:/vault/policies:ro
      # Only Vault's own certificate and key, plus the CA certificate.
      - ./certs/internal/ca.crt:/vault/tls/ca.crt:ro
      - ./certs/internal/vault.crt:/vault/tls/vault.crt:ro
      - ./certs/internal/vault.key:/vault/tls/vault.key:ro
      - vault_data:/vault/file
    networks:
      - backend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M
    healthcheck:
      # "vault status" exits 0 when unsealed and 2 when sealed.
      # Both mean the server is running; a sealed Vault is reported by the alerts (stage 6).
      test: ["CMD-SHELL", "vault status > /dev/null; [ $$? -le 2 ]"]
      interval: 15s
      timeout: 5s
      start_period: 10s

# frontend receives external traffic through Nginx.
# app connects only the WAF and Django (internal: true), preventing WAF bypass.
# backend is internal (internal: true) with no internet access.
# observability isolates metrics and log collection.
networks:
  frontend:
    driver: bridge
    # Fixed subnet so Nginx can have a fixed address, which the WAF's real-client-IP setting depends on.
    ipam:
      config:
        - subnet: 172.28.10.0/24
          # Automatic addresses come only from .128-.255, so they can never clash with nginx's fixed .20.
          ip_range: 172.28.10.128/25
  # Only the WAF and Django. internal: no internet route.
  app:
    driver: bridge
    internal: true
  backend:
    driver: bridge
    internal: true
  observability:
    driver: bridge
  # Only the Docker API proxy, Alloy and CrowdSec may reach this internal network.
  docker_api:
    driver: bridge
    internal: true
  # The web container's only route to the internet. The host firewall (docker/nftables/kura.nft)
  # lets 172.28.60.10 reach only Gmail SMTP (587) and HaveIBeenPwned (443), plus DNS.
  egress:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.60.0/24
  # Django <-> ClamAV only (INSTREAM is plain TCP; internal: no internet route; CFG-06).
  clamav:
    driver: bridge
    internal: true
  # Outbound-only route for ClamAV signature updates (nothing else joins it).
  clamav_updates:
    driver: bridge

# Persistent Named Volumes
volumes:
  postgres_data:
    # Keep pgEdge on a fresh volume.
    # The similarly named kura_postgres_data volume is an older cluster and does not use the pgEdge data-directory layout.
    name: kura_pgedge_postgres_data
  clamav_db:
    name: kura_clamav_db
  crowdsec_data:
    name: kura_crowdsec_data
  crowdsec_config:
    name: kura_crowdsec_config
  loki_data:
    name: kura_loki_data
  # Alloy's persistent positions let it resume reading without replaying history.
  alloy_data:
    name: kura_alloy_data
  prometheus_data:
    name: kura_prometheus_data
  grafana_data:
    name: kura_grafana_data
  vault_data:
    name: kura_vault_data
  postgres_backups:
    name: kura_postgres_backups
  postgres_backups_offsite:
    name: kura_postgres_backups_offsite

# Mount file-backed Docker secrets at /run/secrets in RAM.
secrets:
  db_password:
    file: ./secrets/db_password.txt
  backup_encryption_key:
    file: ./secrets/backup_encryption_key.txt
  django_secret_key:
    file: ./secrets/django_secret_key.txt
  crowdsec_bouncer_key:
    file: ./secrets/crowdsec_bouncer_key.txt
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
  telegram_chat_id:
    file: ./secrets/telegram_chat_id.txt
  vault_role_id:
    file: ./secrets/vault_role_id.txt
  vault_secret_id:
    file: ./secrets/vault_secret_id.txt
