{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="kura-system">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 - Access denied - Kura</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'img/kura-mark.svg' %}">
    <link rel="stylesheet" href="{% static 'css/tailwind.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/daisyui.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/kura.css' %}">
    <script src="{% static 'js/theme-init.js' %}"></script>
</head>
<body class="min-h-screen bg-base-200 text-base-content flex items-center justify-center p-4">
    <div class="k-card max-w-md w-full text-center space-y-4 py-8">
        <div class="flex justify-center">
            <img src="{% static 'img/kura-mark.svg' %}" alt="Kura" class="h-10 w-10">
        </div>
        <div class="text-4xl font-extrabold k-num text-error">403</div>
        <h1 class="text-xl font-semibold">You do not have access to this page.</h1>
        <p class="text-sm k-muted">If you think this is wrong, contact your administrator.</p>
        <div class="pt-2">
            <a href="{% url 'kura:home' %}" class="btn btn-primary btn-sm">Go to dashboard</a>
        </div>
    </div>
</body>
</html>
