{# Empty state shown when a table or card grid has no records to display. #}
<div class="card card-body mb-3 text-center py-5 px-3 vstack gap-2">
    <div class="d-flex justify-content-center text-body-secondary">
        {% include "kura/_icon.html" with name=icon|default:"info" class="k-icon-xl" %}
    </div>
    <div class="vstack gap-1">
        <p class="fw-semibold">{{ title }}</p>
        {% if text %}
        <p class="text-body-secondary small k-max-sm mx-auto">{{ text }}</p>
        {% endif %}
    </div>
    {% if action_url and action_label %}
    <div class="pt-2">
        <a href="{{ action_url }}" class="btn btn-outline-secondary btn-sm">{{ action_label }}</a>
    </div>
    {% endif %}
</div>
