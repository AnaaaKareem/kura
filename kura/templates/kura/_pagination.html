{% if page_obj and page_obj.has_other_pages %}
<nav class="flex items-center justify-between border-t border-base-300 px-4 py-3 sm:px-6 mt-4" aria-label="Pagination">
    <div class="hidden sm:block">
        <p class="text-sm k-muted">
            Showing page <span class="font-medium text-base-content">{{ page_obj.number }}</span> of <span class="font-medium text-base-content">{{ page_obj.paginator.num_pages }}</span>
        </p>
    </div>
    <div class="flex flex-1 justify-between sm:justify-end gap-2">
        {% if page_obj.has_previous %}
        <a href="?page={{ page_obj.previous_page_number }}" class="btn btn-outline btn-sm">Previous</a>
        {% endif %}
        {% if page_obj.has_next %}
        <a href="?page={{ page_obj.next_page_number }}" class="btn btn-outline btn-sm">Next</a>
        {% endif %}
    </div>
</nav>
{% endif %}
