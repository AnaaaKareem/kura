{% extends "kura/base.html" %}

{% block title %}Course details - Kura{% endblock %}

{% block content %}
<!-- Show the administrator a simple form for course metadata only. -->
<div class="max-w-2xl mx-auto">
    <div class="card bg-base-100 border border-base-300">
        <div class="card-body gap-4 p-4 sm:p-6">
            <h1 class="card-title text-2xl">{% if editing %}Edit course{% else %}New course{% endif %}</h1>
            <!-- Submit only the form's allowed fields and include CSRF protection. -->
            <form method="post" class="space-y-4">
                {% csrf_token %}
                {{ form.as_p }}
                <div class="card-actions justify-end">
                    <a href="{% url 'kura:course_list' %}" class="btn btn-ghost">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save course</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
