# ==============================================================================
# ClamAV scanner (clamd) settings for Kura
# Replaces the image's default /etc/clamav/clamd.conf (mounted read-only).
# Django sends every upload here (INSTREAM on port 3310) before saving it.
# ==============================================================================

# Logging (the folder is a small in-memory tmpfs in docker-compose.yml).
LogFile /var/log/clamav/clamd.log
LogTime yes

# Where clamd listens: a local socket for the health check, and TCP 3310 for
# Django on the internal backend network (no port is published to the host).
LocalSocket /tmp/clamd.sock
TCPSocket 3310

# Accept uploads up to Kura's 25 MiB limit (plus a little room). Anything
# bigger is refused by nginx and Django long before it gets here.
StreamMaxLength 26M

# Reject what cannot be checked (Kura policy, stage "ClamAV"):
# - AlertEncrypted: password-protected ZIP files, PDFs and Office documents.
#   ClamAV cannot look inside them, so malware could hide there.
#   Reported as e.g. "Heuristics.Encrypted.Zip" or "Heuristics.Encrypted.PDF".
AlertEncrypted yes
# - AlertOLE2Macros: Office files containing VBA macros (small programs that
#   run when the file opens). Reported as "Heuristics.OLE2.ContainsMacros".
AlertOLE2Macros yes
# - AlertExceedsMax: files too large or too deeply packed to scan completely
#   (for example a "zip bomb"). Reported as "Heuristics.Limits.Exceeded...".
AlertExceedsMax yes
