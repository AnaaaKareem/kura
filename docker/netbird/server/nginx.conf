# ==============================================================================
# netbird-proxy: TLS front door for the self-hosted NetBird server.
# https://netbird.kura.lan (port 443 only; no plain HTTP at all).
# Adapted from NetBird v0.82.0's official nginx template (getting-started.sh,
# render_nginx_conf), with Kura's Vault-issued certificate.
# ==============================================================================

upstream netbird_dashboard {
    server netbird-dashboard:8080;
    keepalive 10;
}
upstream netbird_server {
    server netbird-server:8080;
}

server {
    listen 443 ssl;
    http2 on;
    server_name netbird.kura.lan;

    # Certificate from Kura's Vault CA (certs/renew-certs-from-vault.sh renews it
    # weekly and reloads this nginx). Admin devices must trust Kura's root CA.
    ssl_certificate     /etc/nginx/certs/netbird.crt;
    ssl_certificate_key /etc/nginx/certs/netbird.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    server_tokens off;

    # Browsers must always use HTTPS for this name (one year).
    add_header Strict-Transport-Security "max-age=31536000" always;

    # gRPC streams (management and signal) stay open for a long time.
    client_header_timeout 1d;
    client_body_timeout 1d;

    # Pass the real client address on; netbird-server trusts it only from this
    # proxy's fixed address (172.28.40.10, trustedHTTPProxies in its config).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Scheme $scheme;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;
    grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # WebSocket connections: the relay, and the WebSocket fallback.
    location ~ ^/(relay|ws-proxy/) {
        proxy_pass http://netbird_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 1d;
    }

    # Native gRPC: management (peers, policies) and signal (connection setup).
    location ~ ^/(signalexchange\.SignalExchange|management\.ManagementService)/ {
        grpc_pass grpc://netbird_server;
        grpc_read_timeout 1d;
        grpc_send_timeout 1d;
        grpc_socket_keepalive on;
    }

    # REST API and the embedded login (OAuth2) pages.
    location ~ ^/(api|oauth2)/ {
        proxy_pass http://netbird_server;
        proxy_set_header Host $host;
    }

    # Everything else: the admin dashboard.
    location / {
        proxy_pass http://netbird_dashboard;
    }
}
