# ==============================================================================
# PostgreSQL Client Authentication Configuration File (pg_hba.conf)
#
# PostgreSQL uses the FIRST line that matches the connection type, database
# and user, and never falls through to a later line if the login then fails.
# Every TCP connection must use TLS. Users not listed here cannot log in.
#
# - kura-admin:   migrations and administration, password inside TLS.
# - vault_admin:  Vault's database engine. Password (only Vault knows it, after
#                 "rotate-root") AND a client certificate from our CA.
# - kura_dyn_*:   Django's temporary users, created by Vault for 15 minutes.
#                 Password from Vault AND Django's client certificate.
# kura_app itself is NOLOGIN and has no line here.
# ==============================================================================

# "local" is for Unix domain socket connections only (used by the health check,
# pgBackRest and init-vault.sh inside the db container; nothing else runs there).
local   all             all                                     trust

# Migrations and administrative maintenance: kura-admin with its password
# (Docker secret), always inside an encrypted TLS session.
hostssl kura           kura-admin      all                     scram-sha-256

# Vault's database engine: password + client certificate signed by our CA.
hostssl kura           vault_admin     all                     scram-sha-256 clientcert=verify-ca

# Django's temporary users (names start with "kura_dyn_", see the regular
# expression after "/"): password + client certificate signed by our CA.
# verify-ca (not verify-full): the certificate name cannot match a username
# that changes every 15 minutes.
hostssl kura           /^kura_dyn_     all                     scram-sha-256 clientcert=verify-ca

# Alloy's read-only monitoring login: ONLY with its client certificate, whose
# name (CN) must be exactly "alloy" ("cert" with verify-full). No password.
hostssl kura           alloy           all                     cert clientcert=verify-full

# Reject all connections without TLS.
hostnossl all           all             all                     reject
