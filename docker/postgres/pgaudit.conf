# ==============================================================================
# pgAudit Configuration for Kura LMS (pgaudit.conf)
#
# Enforces comprehensive, tamper-resistant database audit trails.
# Logs are scraped by Grafana Alloy and forwarded to Loki for the 180-day
# regulatory retention requirement (Egyptian Law No. 175 of 2018).
# ==============================================================================

# Enable pgAudit in PostgreSQL's shared preload libraries
shared_preload_libraries = 'pgaudit'

# Audit log classes:
# - write: INSERT, UPDATE, DELETE, TRUNCATE statements
# - ddl: CREATE, ALTER, DROP statements
# - role: GRANT, REVOKE, CREATE/ALTER/DROP ROLE
pgaudit.log = 'write, ddl, role'

# Include SQL statement parameters in audit log records
pgaudit.log_parameter = on

# Do not log system catalog queries to avoid noise
pgaudit.log_catalog = off

# Include relation name in log entries
pgaudit.log_relation = on

