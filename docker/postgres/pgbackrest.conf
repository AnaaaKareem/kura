# ==============================================================================
# pgBackRest Enterprise Backup & Disaster Recovery Configuration
#
# Enforces AES-256-CBC repository encryption, WAL archiving, compression,
# and Point-In-Time Recovery (PITR) for the Kura Learning Management System.
# ==============================================================================

[global]
# Repository storage location (mapped to dedicated persistent volume)
repo1-path=/var/lib/pgbackrest

# AES-256-CBC hardware-accelerated encryption for all backup files and WAL logs.
# pgBackRest has no file: indirection, so the passphrase is supplied via the
# PGBACKREST_REPO1_CIPHER_PASS environment variable from /run/secrets/backup_encryption_key
# (loaded by docker/postgres/entrypoint.sh and docker/postgres/pgbackrest-wrapper.sh).
repo1-cipher-type=aes-256-cbc

# Backup retention policy: keep 7 full backups and 14 differential backups
repo1-retention-full=7
repo1-retention-diff=14

# Secondary repository (off-site / external storage mount, M9).
# In Compose, /var/lib/pgbackrest-offsite maps to $KURA_OFFSITE_BACKUP_DIR
# (an external disk, NFS/SSHFS mount, or dedicated volume synced off-host).
# For direct S3 / Backblaze B2 object storage with Object Lock, replace
# repo2-path with repo2-type=s3, repo2-s3-bucket, repo2-s3-endpoint, and
# repo2-s3-region plus PGBACKREST_REPO2_S3_KEY / KEY_SECRET in environment.
repo2-path=/var/lib/pgbackrest-offsite
repo2-cipher-type=aes-256-cbc
repo2-retention-full=7
repo2-retention-diff=14

# Compression settings (compress before encryption to minimize storage and I/O)
compress-type=lz4
compress-level=3

# Checkpoint behavior: force an immediate checkpoint so backup starts promptly
start-fast=y

# Logging configuration
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[kura]
# Database cluster stanza definition (pgEdge data layout)
pg1-path=/var/lib/pgsql/17/data
pg1-socket-path=/var/run/postgresql
pg1-user=kura-admin
pg1-port=5432

