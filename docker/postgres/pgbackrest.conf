# ==============================================================================
# pgBackRest Enterprise Backup & Disaster Recovery Configuration
#
# Enforces AES-256-CBC repository encryption, WAL archiving, compression,
# and Point-In-Time Recovery (PITR) for the Kura Learning Management System.
# ==============================================================================

[global]
# Repository storage location (mapped to dedicated persistent volume)
repo1-path=/var/lib/pgbackrest

# AES-256-CBC hardware-accelerated encryption for all backup files and WAL logs
# The encryption key is injected securely via Docker secret (never hardcoded)
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=file:/run/secrets/backup_encryption_key

# Backup retention policy: keep 7 full backups and 14 differential backups
repo1-retention-full=7
repo1-retention-diff=14

# Compression settings (compress before encryption to minimize storage and I/O)
compress-type=lz4
compress-level=3

# Checkpoint behavior: force an immediate checkpoint so backup starts promptly
start-fast=y

# Logging configuration
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[kura]
# Database cluster stanza definition (pgEdge data layout)
pg1-path=/var/lib/pgsql/17/data
pg1-socket-path=/var/run/postgresql
pg1-user=kura-admin
pg1-port=5432

