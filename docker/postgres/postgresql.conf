# ==============================================================================
# PostgreSQL Core, SSL/mTLS, WAL Archiving Configuration (postgresql.conf)
#
# The Compose db service mounts this file read-only at /etc/postgresql/
# and starts the server with -c config_file=/etc/postgresql/postgresql.conf.
# Because this file is loaded instead of the generated one in the data
# directory, every parameter the stack depends on must be set here.
# ==============================================================================

# The server process must look for its data files in the pgEdge data directory
# (the PostgreSQL default when a custom config file is used is the config
# file's own directory, so it must be stated explicitly).
data_directory = '/var/lib/pgsql/17/data'

# Listen on all container interfaces so the web service can connect; the
# firewall rules in pg_hba.conf decide who is actually allowed in.
listen_addresses = '*'
port = 5432

# Unix socket for the health check and pgBackRest (tmpfs-backed in Compose)
unix_socket_directories = '/var/run/postgresql'

# 1. SSL / mTLS Configuration
ssl = on
ssl_cert_file = '/var/lib/postgresql/certs/db.crt'
ssl_key_file = '/var/lib/postgresql/certs/db.key'
ssl_ca_file = '/var/lib/postgresql/certs/ca.crt'
ssl_min_protocol_version = 'TLSv1.2'

# 2. Continuous Archiving & Point-In-Time Recovery (PITR) via pgBackRest
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=kura archive-push %p'
archive_timeout = 300
restore_command = 'pgbackrest --stanza=kura archive-get %f "%p"'

# 3. Audit logging (pgAudit). Defined rules are kept in pgaudit.conf so the
# audit policy can be reviewed separately from the server core settings.
shared_preload_libraries = 'pgaudit'
include = '/etc/postgresql/pgaudit.conf'

# 4. Write audit events to stderr so Docker logs (and Loki) collect them
# instead of scattering per-restart files inside the read-only filesystem.
logging_collector = off

# Start every log line with the time, process ID, database user and database,
# so each pgAudit entry shows WHICH user ran the statement. This matters because
# Django's database user changes every 15 minutes (kura_dyn_... from Vault).
log_line_prefix = '%m [%p] %q%u@%d '
