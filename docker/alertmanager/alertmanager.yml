# Prometheus Alertmanager Configuration (alertmanager.yml)
# Send operational alerts to Telegram. Application email uses the separate mail relay.
# The bot token and chat ID are read from Docker secret files.

global:
  # How long to wait before treating an alert with no end time as resolved.
  resolve_timeout: 5m

route:
  # Group by alert name and severity, so e.g. all critical alerts arrive in one Telegram message instead of one message per alert.
  group_by: ["alertname", "severity"]
  receiver: "telegram-alerts"
  # Wait briefly for related alerts to arrive together, then re-send the group every 5 minutes if something new fired, and repeat the last notification after 4 hours so alerts are never forgotten.
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Keep breach triage visibly distinct, including for critical alerts.
    - matchers:
        - alertname=~"AuditDiscrepancy|FileDecryptFailed|FileIntegrityFailed|RlsContextFailed|VaultErrors|DbAuthFailures"
      receiver: breach-telegram-alerts
      repeat_interval: 1h
    # Repeat critical alerts hourly; all other alerts use the default interval.
    - matchers:
        - severity="critical"
      receiver: telegram-alerts
      repeat_interval: 1h

receivers:
  # Telegram for general and critical alerts.
  # The bot token and chat ID live in Docker secrets; this file lists only the paths they are mounted at.
  - name: "telegram-alerts"
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id_file: /run/secrets/telegram_chat_id
        send_resolved: true
        # Plain text (empty parse mode): avoids Markdown/HTML escaping bugs in alert text that contains angle brackets or underscores.
        parse_mode: ""
        message: >-
          Kura LMS alert [{{ .Status }}]:
          {{ .CommonLabels.alertname }} (severity {{ .CommonLabels.severity }}):
          {{ .CommonAnnotations.summary }}
          {{ .CommonAnnotations.description }}

  # Breach-class alerts retain their 72-hour triage reminder without using email.
  - name: "breach-telegram-alerts"
    telegram_configs:
      - bot_token_file: /run/secrets/telegram_bot_token
        chat_id_file: /run/secrets/telegram_chat_id
        send_resolved: true
        parse_mode: ""
        message: >-
          [BREACH TRIAGE - 72H CLOCK] Kura LMS alert [{{ .Status }}]:
          {{ .CommonLabels.alertname }} (severity {{ .CommonLabels.severity }}):
          {{ .CommonAnnotations.summary }}
          {{ .CommonAnnotations.description }}
# While Vault is sealed or down, mute the generic "ServiceDown" alert for the web service: VaultSealed is the more useful alert here, and the paired ServiceDown would only duplicate the page.
inhibit_rules:
  - name: vault-sealed-mutes-web-servicedown
    source_matchers:
      - alertname="VaultSealed"
    target_matchers:
      - alertname="ServiceDown"
      - job="web"
