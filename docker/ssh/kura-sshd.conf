# ==============================================================================
# Kura VM SSH hardening. Install on the Ubuntu Server VM as
#     /etc/ssh/sshd_config.d/10-kura.conf
# Read docker/ssh/README.md first: keep a second SSH session open while you
# test, or a mistake here can lock you out of the VM.
#
# Ubuntu's /etc/ssh/sshd_config includes sshd_config.d/*.conf at the top, and
# sshd keeps the FIRST value it reads for each setting, so this file (10-)
# wins over the defaults below it and over later drop-ins such as
# 50-cloud-init.conf.
# ==============================================================================

# Keys only: no passwords, no keyboard-interactive (PAM) prompts, no root.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
# Only Ed25519 keys, in a file or on a hardware security key (FIDO2).
PubkeyAcceptedAlgorithms ssh-ed25519,sk-ssh-ed25519@openssh.com

# Only the named admin account may log in. CHANGE kura-admin to the VM's real
# admin user name before installing (several names are separated by spaces).
AllowUsers kura-admin

# Fewer guesses per connection, and less time to finish logging in.
MaxAuthTries 3
LoginGraceTime 30

# No forwarding of X11, the SSH agent, remote ports or tunnel devices.
X11Forwarding no
AllowAgentForwarding no
GatewayPorts no
PermitTunnel no

# No port forwarding for anyone by default...
AllowTcpForwarding no
PermitOpen none

# ...except the admin's local forward to Grafana on the VM's loopback address
# (ssh -N -L 3000:127.0.0.1:3000 kura-admin@<vm>). Nothing else can be
# forwarded. CHANGE kura-admin here too. Match must stay at the end of the file:
# every setting after it applies only to the matched user.
Match User kura-admin
    AllowTcpForwarding local
    PermitOpen 127.0.0.1:3000
