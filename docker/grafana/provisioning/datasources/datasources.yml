# ==============================================================================
# Grafana Datasources Provisioning (datasources.yml)
#
# Automatically connects Grafana to Prometheus (metrics) and Loki (logs).
# ==============================================================================

apiVersion: 1

datasources:
  # Prometheus Time-Series Metrics Datasource
  # The uid is fixed so provisioned dashboards can reference it by uid.
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  # Loki Log Aggregation Datasource
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000

