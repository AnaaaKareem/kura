# Grafana Datasources Provisioning (datasources.yml)
# Automatically connects Grafana to Prometheus (metrics), Loki (logs) and Alertmanager (active alerts and silences).
# All three are reached over the internal observability network; none of them publishes a host port.

apiVersion: 1

datasources:
  # Prometheus Time-Series Metrics Datasource The uid is fixed so provisioned dashboards can reference it by uid.
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  # Loki Log Aggregation Datasource
  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    editable: false
    jsonData:
      maxLines: 1000

  # Alertmanager: shows the alerts that Loki and Prometheus are firing.
  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093
    isDefault: false
    editable: false
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: false

