# Detect more than 10 failed Kura logins from one IP in 5 minutes.
# Each matching event adds a drop to a bucket that drains at a steady rate.
# If the bucket overflows (more than 10 events faster than the leak), an alert is raised and the remediation profile bans the IP.
# How to read the numbers: "capacity" is how many matching events fit in the bucket and "leakspeed"
# is how often one event drains out. Slow, normal use never fills it. A burst overflows it and
# raises an alert. "groupby" keeps one bucket per source IP, so one noisy address cannot ban others.
# "blackhole" ignores the same IP for a while after an alert, so one attacker does not flood alerts.
type: leaky
name: kura/login-bruteforce
description: "More than 10 failed Kura logins from one IP in 5 minutes"
filter: "evt.Meta.service == 'kura' && evt.Meta.log_type == 'auth.login.failed'"
groupby: evt.Meta.source_ip
capacity: 10
leakspeed: "30s"
blackhole: 5m
labels:
  remediation: true
  service: kura
  type: bruteforce
