# ==============================================================================
# CrowdSec scenario: More than 10 failed Kura logins from one IP in 5 minutes
# A "leaky bucket": each matching event adds one drop; drops leak out at a
# steady rate. If the bucket overflows (more than 10 events faster than the
# leak), an alert is raised and the remediation profile bans the IP.
# ==============================================================================
type: leaky
name: kura/login-bruteforce
description: "More than 10 failed Kura logins from one IP in 5 minutes"
filter: "evt.Meta.service == 'kura' && evt.Meta.log_type == 'auth.login.failed'"
groupby: evt.Meta.source_ip
capacity: 10
leakspeed: "30s"
blackhole: 5m
labels:
  remediation: true
  service: kura
  type: bruteforce
