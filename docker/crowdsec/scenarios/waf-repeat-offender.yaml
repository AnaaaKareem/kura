# ==============================================================================
# CrowdSec scenario: More than 20 WAF-blocked requests from one IP in 5 minutes
# A "leaky bucket": each matching event adds one drop; drops leak out at a
# steady rate. If the bucket overflows (more than 20 events faster than the
# leak), an alert is raised and the remediation profile bans the IP.
# ==============================================================================
type: leaky
name: kura/waf-repeat-offender
description: "More than 20 WAF-blocked requests from one IP in 5 minutes"
filter: "evt.Meta.service == 'kura' && evt.Meta.log_type == 'waf_block'"
groupby: evt.Meta.source_ip
capacity: 20
leakspeed: "15s"
blackhole: 5m
labels:
  remediation: true
  service: kura
  type: exploit
