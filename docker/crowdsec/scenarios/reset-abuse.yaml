# ==============================================================================
# CrowdSec scenario: More than 20 password-reset requests from one IP in 10 minutes
# A "leaky bucket": each matching event adds one drop; drops leak out at a
# steady rate. If the bucket overflows (more than 20 events faster than the
# leak), an alert is raised and the remediation profile bans the IP.
# ==============================================================================
type: leaky
name: kura/reset-abuse
description: "More than 20 password-reset requests from one IP in 10 minutes"
filter: "evt.Meta.service == 'kura' && evt.Meta.log_type == 'auth.password.reset_requested'"
groupby: evt.Meta.source_ip
capacity: 20
leakspeed: "30s"
blackhole: 5m
labels:
  remediation: true
  service: kura
  type: abuse
