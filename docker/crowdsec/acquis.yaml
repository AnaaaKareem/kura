# ==============================================================================
# CrowdSec Log Acquisition Configuration (acquis.yaml)
#
# Specifies the log streams that CrowdSec continuously monitors for threats.
# CrowdSec parses incoming log lines, applies behavioral detection scenarios,
# and issues remediation bans for malicious actors.
# ==============================================================================

# 1. Nginx Reverse Proxy Access and Error Logs
# Monitors all web requests hitting the Kura application edge.
# Detects: HTTP 4xx scanning, SQLi probes, path traversal, exploit payloads.
# nginx writes its access and error logs to the container output (the image
# links /var/log/nginx/*.log to /dev/stdout and /dev/stderr), so they are read
# through the read-only Docker API proxy, like the WAF and Django logs below.
source: docker
docker_host: tcp://docker-api-proxy:2375
container_name:
  - kura-nginx
labels:
  type: nginx

---
# 2. Coraza audit records arrive through the restricted Docker API proxy.
# A separate type lets the custom parser distinguish them from nginx lines.
source: docker
docker_host: tcp://docker-api-proxy:2375
container_name:
  - kura-waf
labels:
  type: coraza_audit

---
# 3. Django writes security events to its container output, not log files.
# The custom parser will extract the event and source IP from those lines.
source: docker
docker_host: tcp://docker-api-proxy:2375
container_name:
  - kura-web
labels:
  type: kura_django
