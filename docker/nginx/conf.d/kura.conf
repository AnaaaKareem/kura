# ==============================================================================
# HTTP Server (Port 80)
# Redirects all insecure plaintext HTTP requests to secure HTTPS on port 8443
# ==============================================================================
server {
    listen 80;
    server_name localhost 127.0.0.1;
    server_tokens off;

    # Redirect to HTTPS preserving the original URI. The host is this server's
    # own name ($server_name), never the visitor's Host header, so a forged
    # Host cannot turn this into a redirect to another website.
    return 301 https://$server_name:8443$request_uri;
}

# ==============================================================================
# HTTPS Server (Port 443)
# Enforces TLS 1.3 only, HSTS, 25MB body limit, rate limits, and reverse proxy
# ==============================================================================
server {
    listen 443 ssl;
    server_name localhost 127.0.0.1;
    server_tokens off;

    # Security requirement: Enforce 25 MB upload limit
    client_max_body_size 25M;

    # Security requirement: TLS 1.3 only
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_certificate /etc/nginx/certs/kura.crt;
    ssl_certificate_key /etc/nginx/certs/kura.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security requirement: HTTP Strict Transport Security (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Defense-in-depth headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Docker embedded DNS resolver (127.0.0.11) for dynamic service discovery
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Real client IP. Behind the Cloudflare Tunnel every request arrives from
    # the cloudflared container, so $remote_addr would be the same for all
    # users (breaking rate limits and CrowdSec). Cloudflare puts the visitor's
    # IP in the CF-Connecting-IP header. We trust that header ONLY from
    # cloudflared's fixed address (docker-compose.yml), so nobody else can fake it.
    set_real_ip_from 172.28.10.10;
    real_ip_header CF-Connecting-IP;

    # Upstream: every dynamic request goes to the Coraza WAF, never straight
    # to Django. (Django is not even on Nginx's network, so it cannot be skipped.)
    set $kura_upstream https://waf:8443;

    # Mutual TLS to the WAF: Nginx presents its own certificate (the WAF only
    # accepts CN=nginx) and checks the WAF's certificate against Kura's CA.
    proxy_ssl_certificate /etc/nginx/certs/internal/nginx.crt;
    proxy_ssl_certificate_key /etc/nginx/certs/internal/nginx.key;
    proxy_ssl_trusted_certificate /etc/nginx/certs/internal/ca.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_name waf;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.3;

    # Serve static assets directly from shared volume with caching.
    # nginx stops inheriting server-level add_header lines as soon as a location
    # has one of its own, so the security headers are repeated here.
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Stricter rate limit for the sign-in pages: login, MFA code and password
    # reset (10 requests per minute per IP, short burst of 10 allowed).
    # These are Kura's real URLs (kura/urls.py); the old /accounts/login/
    # path did not exist, so this limit never applied before.
    location ~ ^/(?:login|password/reset)/ {
        limit_req zone=login_limit burst=10 nodelay;

        proxy_pass $kura_upstream;
        proxy_http_version 1.1;
        # Django needs the original host name; it rejects any name not in
        # ALLOWED_HOSTS (HTTP 400), so a forged Host header goes nowhere.
        proxy_set_header Host $http_host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # General proxy route for application endpoints
    location / {
        limit_req zone=general_limit burst=10 nodelay;

        proxy_pass $kura_upstream;
        proxy_http_version 1.1;
        # Django needs the original host name; it rejects any name not in
        # ALLOWED_HOSTS (HTTP 400), so a forged Host header goes nowhere.
        proxy_set_header Host $http_host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 8443;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
