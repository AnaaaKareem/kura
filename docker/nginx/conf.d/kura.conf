# Static file cache time. ManifestStaticFilesStorage writes every file twice: once under its own name and once with a 12-character content hash, for example kura.a0079294ba3a.css. collectstatic runs when the image is built.
# Pages link to the hashed copy, and that name changes whenever the file changes, so browsers may keep it for 30 days.
# The unhashed copy (used by 500.html and old links) can change under the same name, so it is cached for 5 minutes only.
map $uri $kura_static_cache {
    "~\.[0-9a-f]{12}\.[A-Za-z0-9]+$" "public, max-age=2592000, immutable";
    default "public, max-age=300";
}

# Fallback CSP for responses nginx makes itself (429 rate limits, 404 for /static/, upstream errors).
# Django already sends its own CSP, so the fallback is empty (not sent) whenever Django set one.
map $upstream_http_content_security_policy $kura_fallback_csp {
    "" "default-src 'none'; script-src 'none'; style-src 'none'; img-src 'none'; font-src 'none'; connect-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none'";
    default "";
}

# HTTP Server (Port 80) Redirects every plaintext HTTP request to HTTPS on port 443
server {
    listen 80;
    server_name localhost 127.0.0.1;
    server_tokens off;

    # Use the configured host, not the request's Host header, while preserving the path.
    return 301 https://${KURA_PUBLIC_HOSTNAME}$request_uri;
}

# HTTPS Server (Port 443) Enforces TLS 1.3 only, HSTS, 25MB body limit, rate limits, and reverse proxy
server {
    listen 443 ssl;
    server_name localhost 127.0.0.1;
    server_tokens off;

    # Security requirement: allow 25 MiB file uploads plus multipart/CSRF overhead (matches Coraza's 26M / 27,262,976-byte SecRequestBodyLimit).
    client_max_body_size 26M;

    # Security requirement: TLS 1.3 only
    ssl_protocols TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_certificate /etc/nginx/certs/kura.crt;
    ssl_certificate_key /etc/nginx/certs/kura.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security requirement: HTTP Strict Transport Security (HSTS)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Defense-in-depth headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # Only this origin may load Kura's responses as resources.
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # Prevent loading cross-origin resources without explicit permission (CORP/CORS).
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Content-Security-Policy $kura_fallback_csp always;
    # Django sends HSTS too; send only nginx's copy, because two HSTS headers break the spec.
    proxy_hide_header Strict-Transport-Security;

    # Docker embedded DNS resolver (127.0.0.11) for dynamic service discovery
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Real client IP.
    # Visitors connect straight to this port, so $remote_addr is the visitor's address.
    # No client header (X-Forwarded-For, X-Real-IP or any CDN header) is trusted for it, so nobody can fake their IP to dodge the rate limits or CrowdSec.

    # Upstream: every dynamic request goes to the Coraza WAF, never straight to Django. (Django is not even on Nginx's network, so it cannot be skipped.)
    set $kura_upstream https://waf:8443;

    # Mutual TLS to the WAF: Nginx presents its own certificate (the WAF only accepts CN=nginx) and checks the WAF's certificate against Kura's CA.
    proxy_ssl_certificate /etc/nginx/certs/internal/nginx.crt;
    proxy_ssl_certificate_key /etc/nginx/certs/internal/nginx.key;
    proxy_ssl_trusted_certificate /etc/nginx/certs/internal/ca.crt;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 2;
    proxy_ssl_name waf;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.3;

    # Serve static files straight from the shared volume, but only the folders Kura's pages load: css, fonts, img and js (Kura's own) and mfa (the passkey pages from django-mfa2).
    # Django admin is not published, so the admin, django_otp and otp_totp folders are never served.
    # nginx cleans up "../" and "%2e%2e" before matching, so a request cannot climb out of /app/staticfiles.
    # nginx stops inheriting server-level add_header lines as soon as a location has one of its own, so the security headers are repeated here.
    location ~ ^/static/((?:css|fonts|img|js|mfa)/.+)$ {
        alias /app/staticfiles/$1;
        # Never list a folder's contents.
        autoindex off;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        # 30 days for hashed names, 5 minutes for the rest (see the map at the top).
        add_header Cache-Control $kura_static_cache;
        access_log off;
    }

    # Anything else under /static/ (other folders, the folder roots themselves, the manifest file) is not found.
    location /static/ {
        return 404;
    }

    # Stricter rate limit for the sign-in pages: login, MFA code and password reset (10 requests per minute per IP, short burst of 10 allowed).
    # These are Kura's real URLs (kura/urls.py); the old /accounts/login/ path did not exist, so this limit never applied before.
    location ~ ^/(?:login|password/reset)/ {
        limit_req zone=login_limit burst=10 nodelay;
        limit_conn conn_limit 10;

        # Public HTTPS reverse-proxy route to the isolated Gunicorn upstream; external browsers must reach login/reset endpoints.
        proxy_pass $kura_upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_http_version 1.1;
        # Django needs the original host name; it rejects any name not in ALLOWED_HOSTS (HTTP 400), so a forged Host header goes nowhere.
        proxy_set_header Host $http_host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # General proxy route for application endpoints
    location / {
        limit_req zone=general_limit burst=10 nodelay;
        limit_conn conn_limit 30;

        # Public HTTPS reverse-proxy route to the isolated Gunicorn upstream for normal authenticated LMS traffic.
        proxy_pass $kura_upstream; # nosemgrep: generic.nginx.security.missing-internal.missing-internal
        proxy_http_version 1.1;
        # Django needs the original host name; it rejects any name not in ALLOWED_HOSTS (HTTP 400), so a forged Host header goes nowhere.
        proxy_set_header Host $http_host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
