user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Replace reset tokens before recording a request URI in access logs.
    # Also redact the attendance check-in passcode (?code= or &code=), which is
    # short-lived but still a credential; the prefix and the rest of the query
    # are kept so the log line stays useful.
    map $request_uri $kura_log_uri {
        ~^/password/reset/[^/]+/  "/password/reset/<redacted>/";
        ~^(?<prefix>.*[?&])code=[^&]*(?<suffix>.*)$  "${prefix}code=[REDACTED]${suffix}";
        default                   $request_uri;
    }

    # Keep the standard combined fields first so CrowdSec can parse each request.
    log_format security '$remote_addr - $remote_user [$time_local] "$request_method $kura_log_uri $server_protocol" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" $request_id $request_time';

    access_log /var/log/nginx/access.log security;

    # Basic performance tuning
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Security requirement: Hide Nginx server version banner from headers and error pages
    server_tokens off;

    # Security requirement: rate limits per client IP.
    # general: 10 requests per second for normal pages.
    # login: 10 requests per MINUTE for sign-in pages (slows password guessing).
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;
    limit_req_status 429;

    # Load application virtual host configuration
    include /etc/nginx/conf.d/*.conf;
}
