# ==============================================================================
# OWASP Core Rule Set (CRS) settings for Kura
#
# Loaded right after the image's stock crs-setup.conf (where all of these are
# commented out), so the values below are the ones the CRS uses.
# ==============================================================================

# Paranoia levels:
# - Blocking level 1: only the most reliable rules can block a request.
# - Detection level 2: stricter rules also run, but only LOG (so we can see
#   what they would catch and tune them before ever turning them on).
SecAction \
    "id:900000,phase:1,pass,t:none,nolog,\
    setvar:tx.blocking_paranoia_level=1"
SecAction \
    "id:900001,phase:1,pass,t:none,nolog,\
    setvar:tx.detection_paranoia_level=2"

# Anomaly scoring: each matching rule adds points (critical = 5). A request
# is blocked when its total reaches 5, i.e. one critical match. This is the
# CRS-recommended default.
SecAction \
    "id:900110,phase:1,pass,t:none,nolog,\
    setvar:tx.inbound_anomaly_score_threshold=5,\
    setvar:tx.outbound_anomaly_score_threshold=4"

# Upload size limits used by the CRS. Its default is 1 MB, which would block
# normal Kura uploads. Kura allows 25 MiB per file (kura/files.py), so match it.
SecAction \
    "id:900340,phase:1,pass,t:none,nolog,\
    setvar:tx.max_file_size=26214400"
SecAction \
    "id:900350,phase:1,pass,t:none,nolog,\
    setvar:tx.combined_file_sizes=26214400"
