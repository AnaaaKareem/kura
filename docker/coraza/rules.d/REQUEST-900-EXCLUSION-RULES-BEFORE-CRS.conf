# ==============================================================================
# Kura LMS - OWASP Core Rule Set (CRS v4) exclusions
# Mounted at: /etc/coraza/rules.d/REQUEST-900-EXCLUSION-RULES-BEFORE-CRS.conf
#
# Loaded BEFORE the CRS rules (see coraza-rules.conf). Each exclusion switches
# the CRS off for ONE named form field, and only on the URLs that use it.
# Every other field on those pages, and every other page, is still inspected.
#
# Why these fields are safe to exclude: Django never builds SQL from them (it
# uses the ORM with parameters), templates escape them on output, and staff
# text is cleaned with nh3 before saving. The WAF is an extra layer, not the
# only one.
#
# "OWASP_CRS" is a tag carried by every CRS rule, so
#   ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:x
# means "no CRS rule looks at field x for this request".
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. Password fields (login, password change, password reset)
# A strong password can look like an attack, e.g.  ' OR 1=1 --!x
# Passwords are only ever hashed with Argon2, never put into SQL or HTML.
# Excluding them also guarantees a password never appears in the WAF log
# as "matched data".
# ------------------------------------------------------------------------------
SecAction \
    "id:10001,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:old_password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:new_password,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:confirm_password"

# ------------------------------------------------------------------------------
# 2. Student answers (autosave and submit)
# Kura is used for a security module: answers legitimately contain SQL,
# shell commands and <script> examples. Field: response_text
# (kura/forms.py AssessmentAnswerForm).
# URLs: /attempts/<uuid>/autosave/ and /attempts/<uuid>/submit/
# ------------------------------------------------------------------------------
SecRule REQUEST_FILENAME "@rx ^/attempts/[0-9a-f-]{36}/(?:autosave|submit)/$" \
    "id:10002,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:response_text"

# ------------------------------------------------------------------------------
# 3. Staff-written course content
# Instructors write Markdown/HTML material and assessment text that can
# include code examples. Fields (kura/forms.py):
#   content_body (section items), description (courses, assessments),
#   prompt, rubric, explanation (assessment questions)
# URLs: the staff authoring pages only.
# ------------------------------------------------------------------------------
SecRule REQUEST_FILENAME "@rx ^/(?:admin/courses|courses|modules|sections|items|assessments)/" \
    "id:10003,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:content_body,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:description,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:prompt,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:rubric,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:explanation"

# ------------------------------------------------------------------------------
# 4. Grading feedback
# Feedback on a code answer often quotes the student's code.
# Field: feedback (GradeEntryForm). URL: /attempts/<uuid>/grade/
# ------------------------------------------------------------------------------
SecRule REQUEST_FILENAME "@rx ^/attempts/[0-9a-f-]{36}/grade/$" \
    "id:10004,\
    phase:1,\
    pass,\
    nolog,\
    ctl:ruleRemoveTargetByTag=OWASP_CRS;ARGS:feedback"
