# ==============================================================================
# Coraza rule loading order for Kura
#
# Order matters: settings first, then Kura's exclusions, then the CRS rules.
# Files under /opt/coraza/ are the CRS v4 files built into the image.
# Files under /etc/coraza/ are ours, mounted read-only from docker/coraza/.
# ==============================================================================

# 1. Engine settings (body limits, audit log).
Include /etc/coraza/coraza.conf

# 2. CRS stock setup file (sets default actions and the CRS version).
Include /opt/coraza/config/crs-setup.conf

# 3. Kura's CRS settings (paranoia level, anomaly threshold, upload sizes).
Include /etc/coraza/kura-crs-setup.conf

# 4. Kura's exclusions: must load BEFORE the CRS rules they switch off.
Include /etc/coraza/rules.d/*.conf

# 5. The OWASP Core Rule Set itself.
Include /opt/coraza/owasp-crs/rules/*.conf
