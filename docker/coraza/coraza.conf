# ==============================================================================
# Coraza engine settings for Kura (replaces the image's generated coraza.conf)
# ==============================================================================

# Block requests (not just log them) when the CRS anomaly score is too high.
SecRuleEngine On

# Inspect request bodies (form posts and uploads), where most attacks are.
SecRequestBodyAccess On
# Whole request body including files: 26 MB (Nginx already limits it to 25 MB).
SecRequestBodyLimit 27262976
# Body without files (normal form fields): 1 MB is plenty for Kura's forms.
SecRequestBodyNoFilesLimit 1048576
# Anything bigger is rejected rather than half-inspected.
SecRequestBodyLimitAction Reject

# Do NOT inspect responses. Kura's course material legitimately contains code
# and SQL examples (it is a security course), which outbound rules would block.
# Django's DEBUG=False already stops error pages leaking internals.
SecResponseBodyAccess Off

# Working folders: /tmp is the only writable place in this read-only container.
SecTmpDir /tmp
SecDataDir /tmp
SecUploadDir /tmp
SecUploadKeepFiles Off

# Audit log: one JSON line per BLOCKED or suspicious request (4xx/5xx).
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?:0[0-35-9]|[1-9][0-9]))"
# Only parts A (time, client IP, URL), H (which rules matched) and Z (end).
# We deliberately leave out B (request headers: session cookies) and
# I (request body: passwords and answers). Security rule 9: no secrets in logs.
SecAuditLogParts AHZ
SecAuditLogType Serial
SecAuditLogFormat JSON
SecAuditLog /dev/stdout

# Reset links contain bearer tokens, so do not create audit records for them.
SecRule REQUEST_FILENAME "@beginsWith /password/reset/" "id:200010,phase:1,pass,nolog,ctl:auditEngine=Off"

SecDebugLogLevel 0

# Tell Coraza how to read JSON and XML bodies so their fields are inspected too.
SecRule REQUEST_HEADERS:Content-Type "^application/json" \
    "id:200001,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=JSON"
SecRule REQUEST_HEADERS:Content-Type "^(?:application(?:/soap\+|/)|text/)xml" \
    "id:200000,phase:1,t:none,t:lowercase,pass,nolog,ctl:requestBodyProcessor=XML"

# Reject bodies that cannot be parsed: an attacker could hide a payload there.
SecRule REQBODY_ERROR "!@eq 0" \
    "id:200002,phase:2,t:none,log,deny,status:400,msg:'Failed to parse request body.',severity:2"
SecRule MULTIPART_STRICT_ERROR "!@eq 0" \
    "id:200003,phase:2,t:none,log,deny,status:400,msg:'Multipart request body failed strict validation.'"
# Reject requests with a huge number of fields (used to exhaust the parser).
SecRule &ARGS "@ge 1000" \
    "id:200007,phase:2,t:none,log,deny,status:400,msg:'Too many arguments in request.',severity:2"
