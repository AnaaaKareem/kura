# ==============================================================================
# Coraza WAF: nginx configuration (replaces the image's generated template)
#
# Request path:  Nginx --(mTLS)--> THIS WAF --(mTLS)--> Django (Gunicorn)
#
# We write this file ourselves instead of letting the image generate it at
# start-up, because the container's filesystem is read-only. It also means
# every WAF setting is visible here in the repository.
# ==============================================================================

# Load the Coraza module that is built into this image.
load_module "/usr/lib/nginx/modules/ngx_http_coraza_module.so";

worker_processes auto;
# The container runs as the unprivileged "nginx" user, so files it writes must
# go to the in-memory /tmp folder.
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # Hide the nginx version number.
    server_tokens off;
    keepalive_timeout 60s;

    # Logs go to the container output, where Docker (and later Alloy) collects them.
    # Redact password-reset tokens while preserving the standard combined format.
    # Also redact the attendance check-in passcode (?code= or &code=).
    map $request_uri $kura_log_uri {
        ~^/password/reset/[^/]+/  "/password/reset/<redacted>/";
        ~^(?<prefix>.*[?&])code=[^&]*(?<suffix>.*)$  "${prefix}code=[REDACTED]${suffix}";
        default                   $request_uri;
    }
    log_format security '$remote_addr - $remote_user [$time_local] "$request_method $kura_log_uri $server_protocol" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for" $http_x_request_id $request_time';
    access_log /dev/stdout security;

    # Temporary files for request bodies must also live in writable /tmp.
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Allow request bodies slightly above Nginx's 25 MB limit, so the front
    # Nginx stays the single place that decides the upload size limit.
    client_max_body_size 26M;

    # Turn on Coraza and load the rule files (order matters, see the file).
    coraza on;
    coraza_rules_file /etc/coraza/coraza-rules.conf;

    # Real client IP: Nginx sends it in X-Real-IP. We trust that header ONLY
    # when the connection comes from Nginx's fixed address on the frontend
    # network (see docker-compose.yml). Coraza then logs the real attacker IP.
    set_real_ip_from 172.28.10.20;
    real_ip_header X-Real-IP;

    # --------------------------------------------------------------------------
    # Main listener: only Nginx may connect (mutual TLS).
    # --------------------------------------------------------------------------
    server {
        listen 8443 ssl;
        server_name waf;

        # The WAF's own certificate, issued by Kura's internal CA.
        ssl_certificate /certs/internal/waf.crt;
        ssl_certificate_key /certs/internal/waf.key;
        ssl_protocols TLSv1.3;
        ssl_session_tickets off;

        # Mutual TLS: the client must present a certificate signed by our CA...
        ssl_client_certificate /certs/internal/ca.crt;
        ssl_verify_client on;
        ssl_verify_depth 2;

        location / {
            # ...and that certificate must belong to Nginx. Other internal
            # services have certificates from the same CA, so checking the CA
            # alone is not enough.
            if ($ssl_client_s_dn !~ "CN=nginx(,|$)") {
                return 403;
            }

            # Forward allowed requests to Django over mutual TLS.
            proxy_pass https://web:8443;
            proxy_http_version 1.1;

            # The WAF proves who it is to Django with its own certificate...
            proxy_ssl_certificate /certs/internal/waf.crt;
            proxy_ssl_certificate_key /certs/internal/waf.key;
            # ...and checks that it is really talking to Django.
            proxy_ssl_trusted_certificate /certs/internal/ca.crt;
            proxy_ssl_verify on;
            proxy_ssl_verify_depth 2;
            proxy_ssl_name web;
            proxy_ssl_server_name on;
            proxy_ssl_protocols TLSv1.3;

            # Pass on the original host, the real client IP and the scheme.
            # Django rejects any host name not in ALLOWED_HOSTS (HTTP 400).
            proxy_set_header Host $http_host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }

    # --------------------------------------------------------------------------
    # Health check listener: loopback only, so only Docker's health check
    # (running inside this container) can reach it. Coraza is off here.
    # --------------------------------------------------------------------------
    server {
        listen 127.0.0.1:8081;
        coraza off;
        access_log off;

        location = /healthz {
            return 200 "ok\n";
        }
    }
}
