# ==============================================================================
# tinyproxy settings for Kura's breach-check proxy.
# Only the web container may use it, and only to reach api.pwnedpasswords.com
# on port 443. Anything else gets "403 Filtered".
# ==============================================================================

# Listen on the proxy's own port inside the private breach_check network.
Port 8888

# Close idle connections quickly; one lookup takes well under a second.
Timeout 30

# Log one line per request to the container output (collected by Alloy into Loki).
LogLevel Info

# A handful of password changes at once is plenty.
MaxClients 20

# Only the private breach_check network (web joins it) may use the proxy.
Allow 172.28.50.0/24

# Only HTTPS tunnels to port 443 ("CONNECT host:443"); plain HTTP and
# other ports are refused.
ConnectPort 443

# Allowlist: refuse every domain except the ones matched in "filter".
# FilterType ere: the patterns are regular expressions.
# FilterURLs Off: match the domain only, not the full address.
Filter "/etc/tinyproxy/filter"
FilterType ere
FilterURLs Off
FilterDefaultDeny Yes

# Do not add a "Via" header or tell the outside world which proxy this is.
DisableViaHeader Yes
