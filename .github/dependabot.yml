version: 2
updates:
  # Maintain Python dependencies defined in requirements.txt
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Wait 7 days after a release before proposing it, so a broken or
    # malicious release is usually found and pulled before we are offered it.
    cooldown:
      default-days: 7

  # Maintain GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Wait 7 days after a release before proposing it, so a broken or
    # malicious release is usually found and pulled before we are offered it.
    cooldown:
      default-days: 7

  # Maintain base images in Dockerfile and docker-compose.yml (CFG-04)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # Wait 7 days after a release before proposing it, so a broken or
    # malicious release is usually found and pulled before we are offered it.
    cooldown:
      default-days: 7

