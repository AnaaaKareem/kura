name: Kura CI/CD Pipeline

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # 1. Code Quality Linting (Ruff)
  lint:
    name: Ruff Python Linter
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: |
          ruff check .

  # 2. Automated Tests & Production Deployment Check
  test-and-deploy-check:
    name: Tests & Deployment Configuration Check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
        env:
          POSTGRES_DB: kura
          POSTGRES_USER: kura
          POSTGRES_PASSWORD: kura_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1 libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Secrets and certificates are never committed (.gitignore), so CI makes its own throwaway ones with the same kura.sh steps a developer uses.
      # kura.sh gives each key and secret to its container user, so it runs as root.
      # The mTLS-certificate tests then check real files.
      - name: Create Throwaway Secrets and Internal Certificates
        run: |
          sudo ./kura.sh secrets
          sudo ./kura.sh mtls-bootstrap

      # Pages link to content-hashed static files (ManifestStaticFilesStorage), and {% static %} raises an error until collectstatic has written the manifest, so it runs before the tests render any page.
      - name: Collect Static Files
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production-environment
          DEBUG: "True"
        run: |
          python manage.py collectstatic --noinput --clear --ignore=admin --ignore=django_otp --ignore=otp_totp

      - name: Run Full Test Suite with PostgreSQL 17
        env:
          DATABASE_NAME: kura
          DATABASE_USER: kura
          DATABASE_PASSWORD: kura_password
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          SECRET_KEY: ci-test-secret-key-not-for-production-environment
          DEBUG: "True"
        run: |
          python manage.py test kura --noinput

      # The security test modules use SimpleNamespace mocks and direct HIBP /
      # Vault calls instead of proxies, so they run as their own test labels
      # to make sure they execute even if default discovery changes.
      - name: Run Security Test Modules
        env:
          DATABASE_NAME: kura
          DATABASE_USER: kura
          DATABASE_PASSWORD: kura_password
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          SECRET_KEY: ci-test-secret-key-not-for-production-environment
          DEBUG: "True"
        run: |
          python manage.py test kura.tests_security_leads_part1 kura.tests_security_leads_part2 kura.tests_security_routes kura.tests_security_gaps kura.tests_signatures kura.tests_owasp_regression --noinput

      - name: Verify Django Production Deploy Checks
        env:
          DATABASE_NAME: kura
          DATABASE_USER: kura
          DATABASE_PASSWORD: kura_password
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          SECRET_KEY: ci-production-deploy-check-secret-key-min-fifty-chars-long-abc123
          DEBUG: "False"
          ALLOWED_HOSTS: localhost,127.0.0.1
          SECURE_SSL_REDIRECT: "True"
        run: |
          python manage.py check --deploy

  # 3. Static Application Security Testing (SAST) with Semgrep
  # Semgrep covers SAST in CI; local Bandit output is retained as coursework evidence.
  semgrep-scan:
    name: Semgrep SAST Scan (OWASP Top 10 & Django)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep@sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Run Semgrep Security Rules
        run: |
          semgrep scan --config "p/django" --config "p/owasp-top-ten" --error

  # 4. Validate infrastructure files without starting the real services.
  infrastructure-config:
    name: Infrastructure configuration checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # These are empty CI-only files, never production credentials.
      # Do not overwrite an existing file if this step is reused in another checkout.
      - name: Create missing placeholder secret files
        run: |
          mkdir -p secrets
          for name in db_password backup_encryption_key django_secret_key crowdsec_bouncer_key grafana_admin_password telegram_bot_token telegram_chat_id vault_role_id vault_secret_id log_hmac_key; do
            test -e "secrets/$name.txt" || touch "secrets/$name.txt"
          done

      # Parsing Compose does not start containers or read secret contents.
      - name: Check Compose configuration
        run: docker compose config --quiet

      # nft -c validates the file without applying the host firewall.
      - name: Install nftables and check firewall syntax
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables
          sudo nft -c -f docker/nftables/kura.nft

      # Use the exact pinned Prometheus image used by the stack.
      - name: Check Prometheus alert rules
        run: |
          docker run --rm --entrypoint=/bin/promtool \
            -v "$PWD/docker/prometheus/alerts.yml:/tmp/alerts.yml:ro" \
            prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2 \
            check rules /tmp/alerts.yml

      # Check alert routing without starting Alertmanager or reading secrets.
      - name: Check Alertmanager configuration
        run: |
          docker run --rm --entrypoint=/bin/amtool \
            -v "$PWD/docker/alertmanager/alertmanager.yml:/tmp/alertmanager.yml:ro" \
            prom/alertmanager:v0.34.2@sha256:39d8bb3966c694a124428a3a88fbcffd40bd069129ecd47c059f8a3f17c55f3b \
            check-config /tmp/alertmanager.yml

      # Validate Alloy's configuration using its pinned image.
      - name: Check Alloy configuration
        run: |
          docker run --rm --entrypoint=/bin/alloy \
            -v "$PWD/docker/alloy/config.alloy:/tmp/config.alloy:ro" \
            grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4 \
            validate /tmp/config.alloy
