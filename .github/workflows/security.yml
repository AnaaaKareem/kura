# Security scans that run on pull requests to main, on pushes to main, weekly (Monday 02:00 UTC)
# and on demand: Gitleaks over the full git history (leaked secrets), pip-audit on the locked
# Python dependencies (known vulnerable packages) and Trivy on the repository, the infrastructure
# files and the built images (CRITICAL and HIGH issues with a fix fail the run).
# The OWASP ZAP scan is not run here. It runs locally through scripts/zap-baseline.sh.
# The token is read-only and actions are pinned to commit hashes, as in ci.yml.
name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks full-history secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full git history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  pip-audit:
    name: Python dependency audit (requirements.lock.txt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Run pip-audit against locked requirements
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          # Documented risk acceptance in `.trivyignore`:
          # python-jose and ecdsa are transitive deps of django-mfa2 mitigated via kura/__init__.py shim.
          pip-audit -r requirements.lock.txt --strict \
            --ignore-vuln PYSEC-2026-4298 \
            --ignore-vuln PYSEC-2026-1325

  trivy:
    name: Trivy fs, config, image scan and CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Scan repository filesystem with Trivy (CRITICAL,HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          severity: 'CRITICAL,HIGH'
      - name: Scan infrastructure config with Trivy (CRITICAL,HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          trivyignores: '.trivyignore'
          severity: 'CRITICAL,HIGH'
      - name: Build images
        run: |
          docker compose build web nginx
      # ignore-unfixed is enabled only because upstream Debian/distroless base layers occasionally
      # carry CVEs with no vendor patch released yet, so rebuilding cannot resolve them. Any
      # HIGH/CRITICAL vulnerability with an available upstream fix fails the build (exit-code: 1).
      - name: Scan kura-web Python dependencies with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'kura-web:latest'
          pkg-types: 'library'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          severity: 'CRITICAL,HIGH'
      - name: Scan kura-web base OS packages with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'kura-web:latest'
          pkg-types: 'os'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      - name: Scan kura-nginx with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'kura-nginx:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      - name: Generate CycloneDX SBOM for kura-web
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'kura-web:latest'
          format: 'cyclonedx'
          output: 'sbom-kura-web.cdx.json'
      - name: Generate CycloneDX SBOM for kura-nginx
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'kura-nginx:latest'
          format: 'cyclonedx'
          output: 'sbom-kura-nginx.cdx.json'
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kura-sboms
          path: |
            sbom-kura-web.cdx.json
            sbom-kura-nginx.cdx.json
