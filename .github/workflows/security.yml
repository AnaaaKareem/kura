name: Security

on:
  push:
    branches: [main, security-tests]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'

jobs:
  trivy:
    name: Trivy image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker compose build web nginx
      - name: Run Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'kura-web:latest,kura-nginx:latest'
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

  zap:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    needs: [trivy]
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          docker compose up -d
          sleep 30
      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'https://localhost'
          fail_action: false
          cmd_options: '-config api.disablekey=true'

  nuclei:
    name: Nuclei scan
    runs-on: ubuntu-latest
    needs: [trivy]
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          docker compose up -d
          sleep 30
      - name: Nuclei scan
        uses: projectdiscovery/nuclei-action@v1
        with:
          target: 'https://localhost'
          severity: 'critical,high,medium'
          fail_on_severity: 'critical,high'

  nikto:
    name: Nikto scan
    runs-on: ubuntu-latest
    needs: [trivy]
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: |
          docker compose up -d
          sleep 30
      - name: Nikto scan
        run: |
          docker run --rm --network host cajosh/nikto -h https://localhost -ssl -nointeractive

  security-tests:
    name: Django security test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and test
        run: |
          docker compose build web
          PW=$(docker compose exec -T db cat /run/secrets/db_password | tr -d '\n')
          docker compose run --rm --entrypoint "" \
            -v "$PWD/kura:/app/kura:ro" \
            -u 10001:10001 \
            -e VAULT_ENABLED=False \
            -e VAULT_DATABASE_CREDENTIALS=False \
            -e DATABASE_USER=kura-admin \
            -e DATABASE_PASSWORD="$PW" \
            -e DATABASE_NAME=kura \
            -e DATABASE_HOST=db \
            -e DATABASE_PORT=5432 \
            -e SECRET_KEY='test-secret-key-for-running-security-tests-only-not-for-production-use-at-all-12345' \
            -e DEBUG=True \
            -e CLAMAV_TIMEOUT_SECONDS=2 \
            -e PYTHONDONTWRITEBYTECODE=1 \
            kura-web:latest \
            python manage.py test \
              kura.tests_security_leads_part1 \
              kura.tests_security_leads_part2 \
              kura.tests_security_routes \
              --noinput