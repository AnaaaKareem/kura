name: Security

on:
  push:
    branches: [main, security-tests]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'

jobs:
  pip-audit:
    name: Python dependency audit (requirements.lock.txt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Run pip-audit against locked requirements
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          # Documented risk acceptance in docs/SECURITY_TRIVY_FINDINGS.md and .trivyignore:
          # python-jose and ecdsa are transitive deps of django-mfa2 mitigated via kura/__init__.py shim.
          pip-audit -r requirements.lock.txt --strict \
            --ignore-vuln PYSEC-2026-4298 \
            --ignore-vuln PYSEC-2026-1325

  trivy:
    name: Trivy image scan and CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build images
        run: |
          docker compose build web nginx
      - name: Scan kura-web Python dependencies with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'kura-web:latest'
          pkg-types: 'library'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          severity: 'CRITICAL,HIGH'
      - name: Scan kura-web base OS packages with Trivy (informational)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'kura-web:latest'
          pkg-types: 'os'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      - name: Scan kura-nginx with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'kura-nginx:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      - name: Generate CycloneDX SBOM for kura-web
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'kura-web:latest'
          format: 'cyclonedx'
          output: 'sbom-kura-web.cdx.json'
      - name: Generate CycloneDX SBOM for kura-nginx
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'kura-nginx:latest'
          format: 'cyclonedx'
          output: 'sbom-kura-nginx.cdx.json'
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kura-sboms
          path: |
            sbom-kura-web.cdx.json
            sbom-kura-nginx.cdx.json

  zap:
    name: OWASP ZAP baseline scan
    runs-on: ubuntu-latest
    needs: [trivy]
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Start stack
        run: |
          sudo ./kura.sh secrets
          sudo ./kura.sh certs
          sudo ./kura.sh mtls-bootstrap
          docker compose up -d
          sleep 30
      - name: ZAP baseline scan
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports
          docker run --rm --network host \
            -v "$PWD/zap-reports:/zap/wrk:rw" \
            ghcr.io/zaproxy/zaproxy:stable@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af \
            zap-baseline.py -t https://localhost -r zap-baseline.html -I
      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-baseline-report
          path: zap-reports/

  security-tests:
    name: Django security test suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine@sha256:d3244e8ce3f165ee3c93d9c4a4b1d0fe48b3a89e2287b717fdcbbde92d405065
        env:
          POSTGRES_DB: kura
          POSTGRES_USER: kura-admin
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1 libpq-dev
          pip install --require-hashes -r requirements.lock.txt
      - name: Run security test modules
        env:
          VAULT_ENABLED: "False"
          VAULT_DATABASE_CREDENTIALS: "False"
          CLAMAV_REQUIRED: "False"
          DATABASE_USER: kura-admin
          DATABASE_PASSWORD: ci_test_password
          DATABASE_NAME: kura
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: "5432"
          DB_SSL_MODE: ""
          SECRET_KEY: test-secret-key-for-running-security-tests-only-not-for-production-use-at-all-12345
          DEBUG: "True"
        run: |
          python manage.py test \
            kura.tests_security_leads_part1 \
            kura.tests_security_leads_part2 \
            kura.tests_security_routes \
            kura.tests_security_gaps \
            kura.tests_signatures \
            --noinput
