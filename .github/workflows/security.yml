name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks full-history secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full git history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Run Gitleaks secret scanner
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  pip-audit:
    name: Python dependency audit (requirements.lock.txt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Python 3.14
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.14"
          cache: "pip"
      - name: Run pip-audit against locked requirements
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          # Documented risk acceptance in docs/SECURITY_TRIVY_FINDINGS.md and .trivyignore:
          # python-jose and ecdsa are transitive deps of django-mfa2 mitigated via kura/__init__.py shim.
          pip-audit -r requirements.lock.txt --strict \
            --ignore-vuln PYSEC-2026-4298 \
            --ignore-vuln PYSEC-2026-1325

  trivy:
    name: Trivy fs, config, image scan and CycloneDX SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Scan repository filesystem with Trivy (CRITICAL,HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          severity: 'CRITICAL,HIGH'
      - name: Scan infrastructure config with Trivy (CRITICAL,HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          trivyignores: '.trivyignore'
          severity: 'CRITICAL,HIGH'
      - name: Build images
        run: |
          docker compose build web nginx
      # ignore-unfixed is enabled only because upstream Debian/distroless base layers occasionally
      # carry CVEs with no vendor patch released yet, so rebuilding cannot resolve them. Any
      # HIGH/CRITICAL vulnerability with an available upstream fix fails the build (exit-code: 1).
      - name: Scan kura-web Python dependencies with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'kura-web:latest'
          pkg-types: 'library'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: '.trivyignore'
          severity: 'CRITICAL,HIGH'
      - name: Scan kura-web base OS packages with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'kura-web:latest'
          pkg-types: 'os'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      - name: Scan kura-nginx with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'kura-nginx:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
      - name: Generate CycloneDX SBOM for kura-web
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'kura-web:latest'
          format: 'cyclonedx'
          output: 'sbom-kura-web.cdx.json'
      - name: Generate CycloneDX SBOM for kura-nginx
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'kura-nginx:latest'
          format: 'cyclonedx'
          output: 'sbom-kura-nginx.cdx.json'
      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kura-sboms
          path: |
            sbom-kura-web.cdx.json
            sbom-kura-nginx.cdx.json

  zap:
    name: OWASP ZAP authenticated baseline scan
    runs-on: ubuntu-latest
    needs: [trivy]
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Bootstrap ephemeral CI Vault and start stack
        run: |
          set -euo pipefail
          sudo touch /var/log/auth.log
          sudo chmod 640 /var/log/auth.log
          mkdir -p var/metrics var/log/kura

          sudo ./kura.sh secrets
          sudo ./kura.sh certs
          sudo ./kura.sh mtls-bootstrap

          docker compose up -d db vault
          for i in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U kura-admin -d kura >/dev/null 2>&1 && \
               docker compose exec -T vault sh -c 'vault status >/dev/null 2>&1; [ $? -le 2 ]'; then
              break
            fi
            sleep 2
          done
          docker compose run --rm kura-migrate

          # Ephemeral CI-only Vault bootstrap: this throwaway Vault (1 key share, threshold 1)
          # exists solely inside the disposable GitHub Actions runner for this single ZAP scan
          # and is destroyed with the runner VM. Unseal key, root token, and AppRole secrets
          # are masked immediately, never printed, and never uploaded as artifacts.
          INIT_JSON=$(docker compose exec -T vault vault operator init -key-shares=1 -key-threshold=1 -format=json)
          UNSEAL_KEY=$(printf '%s' "$INIT_JSON" | jq -r '.unseal_keys_b64[0]')
          ROOT_TOKEN=$(printf '%s' "$INIT_JSON" | jq -r '.root_token')
          unset INIT_JSON
          if [ -z "$UNSEAL_KEY" ] || [ "$UNSEAL_KEY" = "null" ] || [ -z "$ROOT_TOKEN" ] || [ "$ROOT_TOKEN" = "null" ]; then
            echo "Vault initialization failed in CI." >&2
            exit 1
          fi
          echo "::add-mask::$UNSEAL_KEY"
          echo "::add-mask::$ROOT_TOKEN"

          printf '%s' "$UNSEAL_KEY" | docker compose exec -T vault vault write sys/unseal key=- >/dev/null
          unset UNSEAL_KEY

          vault_ci() {
            docker compose exec -T -e VAULT_TOKEN="$ROOT_TOKEN" vault vault "$@"
          }

          vault_ci secrets enable transit >/dev/null
          vault_ci write -f transit/keys/kura-mfa type=aes256-gcm96 >/dev/null
          vault_ci write -f transit/keys/kura-files type=rsa-4096 >/dev/null
          vault_ci write -f transit/keys/kura-receipts type=ecdsa-p256 >/dev/null

          vault_ci secrets enable -path=secret kv-v2 >/dev/null
          vault_ci kv put secret/gmail-app-password value="ci-ephemeral-unused" >/dev/null

          docker compose exec -T db sh -c 'PGPASSWORD="$(tr -d "\r\n" < /run/secrets/db_password)" exec psql -q -U kura-admin -d kura -v ON_ERROR_STOP=1' < docker/postgres/vault-roles.sql >/dev/null
          FIRST_DB_PASS=$(openssl rand -hex 24)
          echo "::add-mask::$FIRST_DB_PASS"
          printf "ALTER ROLE vault_admin WITH PASSWORD '%s';\n" "$FIRST_DB_PASS" | \
            docker compose exec -T db sh -c 'PGPASSWORD="$(tr -d "\r\n" < /run/secrets/db_password)" exec psql -q -U kura-admin -d kura -v ON_ERROR_STOP=1' >/dev/null

          vault_ci secrets enable database >/dev/null
          printf '%s' "$FIRST_DB_PASS" | vault_ci write database/config/kura-postgresql \
            plugin_name=postgresql-database-plugin \
            connection_url="postgresql://{{username}}:{{password}}@db:5432/kura?sslmode=verify-full&sslrootcert=/vault/tls/ca.crt&sslcert=/vault/tls/vault.crt&sslkey=/vault/tls/vault.key" \
            username=vault_admin \
            password=- \
            password_authentication=scram-sha-256 \
            username_template='kura_dyn_{{random 20 | lowercase}}' \
            allowed_roles=kura-app >/dev/null
          unset FIRST_DB_PASS
          vault_ci write -f database/rotate-root/kura-postgresql >/dev/null
          vault_ci write database/roles/kura-app \
            db_name=kura-postgresql \
            creation_statements="CREATE ROLE \"{{name}}\" WITH LOGIN PASSWORD '{{password}}' VALID UNTIL '{{expiration}}' IN ROLE kura_app;" \
            revocation_statements="DROP ROLE IF EXISTS \"{{name}}\";" \
            default_ttl=15m \
            max_ttl=15m >/dev/null

          vault_ci policy write kura-web /vault/policies/kura-web.hcl >/dev/null
          vault_ci auth enable approle >/dev/null
          vault_ci write auth/approle/role/kura-web \
            token_policies=kura-web \
            token_type=batch \
            token_ttl=15m \
            token_max_ttl=15m >/dev/null

          ROLE_ID=$(vault_ci read -field=role_id auth/approle/role/kura-web/role-id)
          SECRET_ID=$(vault_ci write -f -field=secret_id auth/approle/role/kura-web/secret-id)
          echo "::add-mask::$ROLE_ID"
          echo "::add-mask::$SECRET_ID"
          printf '%s\n' "$ROLE_ID" | sudo tee secrets/vault_role_id.txt >/dev/null
          printf '%s\n' "$SECRET_ID" | sudo tee secrets/vault_secret_id.txt >/dev/null
          sudo chown 10001:10001 secrets/vault_role_id.txt secrets/vault_secret_id.txt
          sudo chmod 600 secrets/vault_role_id.txt secrets/vault_secret_id.txt
          unset ROLE_ID SECRET_ID

          vault_ci token revoke -self >/dev/null
          unset ROOT_TOKEN

          docker compose up -d

      - name: Wait for https://localhost/login/ to return HTTP 200
        run: |
          READY=0
          LAST_STATUS=""
          for i in $(seq 1 60); do
            LAST_STATUS=$(curl -sk -o /dev/null -w '%{http_code}' https://localhost/login/ || true)
            if [ "$LAST_STATUS" = "200" ]; then
              READY=1
              break
            fi
            sleep 2
          done
          if [ "$READY" -ne 1 ]; then
            echo "Health check failed: https://localhost/login/ did not return 200 (last status: ${LAST_STATUS:-none})" >&2
            docker compose ps >&2
            exit 1
          fi

      - name: Seed demo data and configure authenticated student session for ZAP
        run: |
          set -euo pipefail
          docker compose exec -T -e DEBUG=True web python manage.py seed_demo_data

          COOKIE_JAR=$(mktemp)
          LOGIN_HTML=$(curl -sk -c "$COOKIE_JAR" https://localhost/login/)
          CSRF_TOKEN=$(printf '%s' "$LOGIN_HTML" | sed -n 's/.*name="csrfmiddlewaretoken" value="\([^"]*\)".*/\1/p' | head -n 1)
          if [ -z "$CSRF_TOKEN" ]; then
            echo "Failed to extract CSRF token from /login/" >&2
            rm -f "$COOKIE_JAR"
            exit 1
          fi

          curl -sk -b "$COOKIE_JAR" -c "$COOKIE_JAR" \
            -H "Referer: https://localhost/login/" \
            -H "Origin: https://localhost" \
            --data-urlencode "csrfmiddlewaretoken=$CSRF_TOKEN" \
            --data-urlencode "email=student@kura.edu" \
            --data-urlencode "password=KuraPass2026!" \
            https://localhost/login/ -o /dev/null

          SESSION_VAL=$(awk '$6 == "__Host-kura_session" {print $7}' "$COOKIE_JAR")
          rm -f "$COOKIE_JAR"
          if [ -z "$SESSION_VAL" ]; then
            echo "Failed to capture __Host-kura_session cookie after student login" >&2
            exit 1
          fi
          echo "::add-mask::$SESSION_VAL"

          # Mark MFA onboarding complete on the demo student so ZAP crawls real authenticated LMS views.
          docker compose exec -T web python -c "import os, django; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings'); django.setup(); from kura.models import User; from kura.permissions import service_rls_context;
          with service_rls_context(): User.objects.filter(email='student@kura.edu').update(mfa_enabled=True)"

          AUTH_STATUS=$(curl -sk -o /dev/null -w '%{http_code}' -H "Cookie: __Host-kura_session=$SESSION_VAL" https://localhost/)
          if [ "$AUTH_STATUS" != "200" ]; then
            echo "Authenticated student dashboard probe returned HTTP $AUTH_STATUS instead of 200" >&2
            exit 1
          fi

          cat > .zap/ci-replacer.prop <<EOF
          replacer.full_list(0).description=kura-ci-student-session
          replacer.full_list(0).enabled=true
          replacer.full_list(0).matchtype=REQ_HEADER
          replacer.full_list(0).matchstr=Cookie
          replacer.full_list(0).regex=false
          replacer.full_list(0).replacement=__Host-kura_session=${SESSION_VAL}
          EOF
          chmod 644 .zap/ci-replacer.prop
          unset SESSION_VAL

      - name: Run OWASP ZAP baseline scan across authenticated site
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'https://localhost/'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-z "-configfile /zap/wrk/.zap/ci-replacer.prop"'
          fail_action: true
          allow_issue_writing: false
          artifact_name: 'zap-baseline-report'

      - name: Remove temporary ZAP replacer session config
        if: always()
        run: |
          rm -f .zap/ci-replacer.prop

      - name: Upload ZAP HTML and JSON reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kura-zap-html-json-reports
          path: |
            report_html.html
            report_json.json
